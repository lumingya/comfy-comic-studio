name: CI
# 每次推送与 PR 的轻量门禁：新版前后端（lint / 类型 / 单测 / 构建）、Spike 单测、扩展与发行包冒烟。
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Spike unit tests (next/)
        run: python -m unittest discover -s next/tests -t next -q
      - name: v4 server (lint + unit tests)
        run: |
          ruff check server extensions
          ruff format --check server extensions
          python -m unittest discover -s server/tests -t server -q
      - name: API v2 clients and release tools (generated client current + lint)
        run: |
          python tools/generate_extension_contracts.py --check
          python clients/python/generate.py --check
          python tools/check_extension_examples.py
          python tools/check_doc_links.py --self-test
          python tools/check_doc_links.py
          ruff check --config server/pyproject.toml examples/extensions/comfy-complex-adapters examples/extensions/standard-image-channels examples/extensions/qa-review/cli.py
          ruff format --check --config server/pyproject.toml examples/extensions/comfy-complex-adapters examples/extensions/standard-image-channels examples/extensions/qa-review/cli.py
          ruff check clients tools
          ruff format --check clients tools
          ruff check --config server/pyproject.toml mio_update_bootstrap.py
          ruff format --check --config server/pyproject.toml mio_update_bootstrap.py
      - name: v4 web (API types current + format + typecheck + tests + build)
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/api/schema.d.ts web/src/api/extensionProtocol.ts
          npm --prefix web run format:check
          npm --prefix web run typecheck
          npm --prefix web test
          python tools/check_extension_examples.py --panel-tests
          npm --prefix web run build
      - name: Preserve built web for isolated browser verification
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ github.sha }}
          path: web/dist
          retention-days: 2
          if-no-files-found: error
      - name: Shipped data manifest
        run: |
          python tools/check_distribution.py
          python tools/build_distribution.py --check
      - name: Standalone assistant extension
        working-directory: extensions/ai-assist/page
        run: |
          npm ci --no-audit --no-fund
          npx prettier --check .
          npm test
          npm run build
          git diff --exit-code -- dist
      - name: v4 release package smoke test
        run: python tools/build_release.py --out "$RUNNER_TEMP/mio-release-smoke"

  launchers:
    # 根目录 start.bat / start.sh 真跑：从零建 .venv、联网装依赖、--check 自检（目录名含空格、中文和 &），
    # 并在最低支持的 Python 3.11 与 Windows 上跑一遍服务端单测。
    name: launchers (${{ matrix.os }}, Python 3.11)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The full Windows suite continues past 30 minutes; retain every test with a bounded budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Launchers (static, bootstrap, real start.bat / start.sh from scratch)
        working-directory: server
        env:
          MIO_LAUNCHER_FULL: '1'
          PY_PYTHON3: '3.11'
        run: python -m unittest tests.test_launchers -v
      - name: v4 server unit tests
        run: python -m unittest discover -s server/tests -t server -q
