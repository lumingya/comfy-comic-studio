name: CI
# 每次推送与 PR 的轻量门禁：新栈前后端（lint / 类型 / 单测 / 构建）、Spike 单测，以及 legacy/ 旧版的
# 构建产物与提交一致、前端契约测试、Python 单元测试、随包数据清单、打包冒烟。浏览器端到端回归见 e2e.yml（手动触发）。
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependency (Pillow)
        run: python -m pip install -r legacy/packaging/requirements.txt
      - name: Legacy build (dev) and verify the committed output is current
        working-directory: legacy
        run: |
          node js/build.js dev
          git diff --exit-code
      - name: Legacy frontend contract tests
        working-directory: legacy
        run: node js/tests.js
      - name: Legacy Python unit tests
        working-directory: legacy
        run: python -m unittest discover -s tests -q
      - name: Spike unit tests (next/)
        run: python -m unittest discover -s next/tests -t next -q
      - name: v3 server (lint + unit tests)
        run: |
          python -m pip install -r server/requirements-dev.txt
          ruff check server
          ruff format --check server
          python -m unittest discover -s server/tests -t server -q
      - name: API v2 clients and release tools (generated client current + lint)
        run: |
          python clients/python/generate.py --check
          ruff check clients tools
          ruff format --check clients tools
      - name: v3 web (API types current + format + typecheck + tests + build)
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/api/schema.d.ts
          npm --prefix web run format:check
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run build
      - name: Shipped data manifest
        run: python legacy/tools/check_distribution.py
      - name: Legacy package smoke test
        run: python legacy/tools/package_project.py --output releases

  launchers:
    # 根目录 start.bat / start.sh 真跑：从零建 .venv、联网装依赖、--check 自检（目录名含空格、中文和 &），
    # 并在最低支持的 Python 3.11 与 Windows 上跑一遍服务端单测。
    name: launchers (${{ matrix.os }}, Python 3.11)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Launchers (static, bootstrap, real start.bat / start.sh from scratch)
        working-directory: server
        env:
          MIO_LAUNCHER_FULL: '1'
        run: python -m unittest tests.test_launchers -v
      - name: v3 server unit tests
        run: python -m unittest discover -s server/tests -t server -q
