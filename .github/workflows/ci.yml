name: CI
# 每次推送与 PR 的轻量门禁：构建产物与提交一致、前端契约测试、Python 单元测试、
# 新栈前后端（lint / 类型 / 单测 / 构建）、随包数据清单、打包冒烟。浏览器端到端回归见 e2e.yml（手动触发）。
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependency (Pillow)
        run: python -m pip install -r packaging/requirements.txt
      - name: Build (dev) and verify the committed output is current
        run: |
          node js/build.js dev
          git diff --exit-code
      - name: Frontend contract tests
        run: node js/tests.js
      - name: Python unit tests
        run: python -m unittest discover -s tests -q
      - name: Spike unit tests (next/)
        run: python -m unittest discover -s next/tests -t next -q
      - name: v3 server (lint + unit tests)
        run: |
          python -m pip install -r server/requirements-dev.txt
          ruff check server
          ruff format --check server
          python -m unittest discover -s server/tests -t server -q
      - name: v3 web (API types current + format + typecheck + tests + build)
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web run gen:api
          git diff --exit-code -- web/src/api/schema.d.ts
          npm --prefix web run format:check
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run build
      - name: Shipped data manifest
        run: python tools/check_distribution.py
      - name: Package smoke test
        run: python tools/package_project.py --output releases
