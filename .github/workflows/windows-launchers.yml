name: Windows launcher regression
on:
  push:
    paths: ['legacy/*.bat', '.gitattributes', 'legacy/.gitattributes', 'legacy/tools/build_release.py', 'legacy/tests/test_windows_launchers.py', '.github/workflows/windows-launchers.yml']
  pull_request:
    paths: ['legacy/*.bat', '.gitattributes', 'legacy/.gitattributes', 'legacy/tools/build_release.py', 'legacy/tests/test_windows_launchers.py', '.github/workflows/windows-launchers.yml']
  workflow_dispatch:
jobs:
  launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the legacy runtime dependency (Pillow)
        run: python -m pip install -r legacy/packaging/requirements.txt
      - name: Test launcher bytes and real CMD execution
        working-directory: legacy
        run: python -m unittest discover -s tests -p test_windows_launchers.py -v
