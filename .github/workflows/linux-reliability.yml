name: Linux reliability and browser regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -r packaging/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python tools/check_distribution.py
      - run: node js/build.js dev
      - run: npm run test:current
      - run: python tools/package_project.py --output releases
