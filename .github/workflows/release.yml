name: Publish legacy release package (3.x)
# Pushing a tag such as v3.2.0 builds the verified source ZIP and attaches it,
# with its SHA-256 file, to a GitHub Release. The in-app updater
# (legacy/backend/mio_update.py) reads exactly these assets, so the tag must match
# legacy/package.json "version"; a "-" in the version marks the release as a pre-release.
on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: legacy/package-lock.json
      - run: python -m pip install -r packaging/requirements.txt
      - run: npm ci
      - name: Resolve version and check the tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}" >&2
            exit 1
          fi
      - run: python tools/check_distribution.py
      - run: node js/build.js dev
      - run: python -m unittest tests.test_update tests.test_content_distribution tests.test_first_use -v
      - run: python tools/package_project.py --output releases
      - name: Attach package to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Mio v${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            legacy/releases/mio-${{ steps.meta.outputs.version }}-source.zip
            legacy/releases/mio-${{ steps.meta.outputs.version }}-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mio-${{ steps.meta.outputs.version }}-source
          path: legacy/releases/
