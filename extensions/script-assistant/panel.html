<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>剧本助手 · Mio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f3ec;
        --panel: #fffefa;
        --line: #25332c2b;
        --text: #202720;
        --muted: #626c63;
        --accent: #70523b;
        --accent-soft: #eee5d8;
        --good: #276b4f;
        --bad: #a33f37;
        font: 14px/1.6 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      :root[data-theme="dark"] {
        --bg: #171b1b;
        --panel: #202525;
        --line: #e5ece02b;
        --text: #eeeae2;
        --muted: #b0b7ae;
        --accent: #d2ab7b;
        --accent-soft: #342d25;
        --good: #8cc6a7;
        --bad: #e39b92;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg: #171b1b;
          --panel: #202525;
          --line: #e5ece02b;
          --text: #eeeae2;
          --muted: #b0b7ae;
          --accent: #d2ab7b;
          --accent-soft: #342d25;
          --good: #8cc6a7;
          --bad: #e39b92;
        }
      }
      * { box-sizing: border-box; }
      body { max-width: 1160px; margin: 0 auto; padding: 20px clamp(12px, 3vw, 28px) 40px; }
      h1 { font-size: clamp(20px, 3vw, 26px); line-height: 1.25; margin: 0; }
      h2 { font-size: 17px; margin: 0; }
      h3 { font-size: 14px; margin: 14px 0 5px; }
      p { margin: 8px 0; }
      button, input, select, textarea {
        font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 8px 11px; max-width: 100%;
      }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }
      button:disabled { opacity: .48; cursor: default; }
      textarea { width: 100%; min-height: 100px; resize: vertical; }
      .topline, .toolbar, .section-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
      .topline { justify-content: space-between; margin-bottom: 16px; }
      .intro, .subtle { color: var(--muted); }
      .intro { max-width: 75ch; margin: 8px 0 18px; }
      .toolbar { margin: 12px 0; }
      .primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 650; }
      .primary:disabled { color: var(--bg); }
      .panel-section { margin-top: 18px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
      .section-heading { justify-content: space-between; margin-bottom: 12px; }
      .diff { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .diff-block { min-width: 0; padding: 10px; border-inline-start: 3px solid var(--line); background: color-mix(in srgb, var(--bg) 65%, transparent); border-radius: 5px; }
      .diff-after { border-color: var(--good); }
      .diff-before { border-color: var(--bad); }
      .diff-label, small { color: var(--muted); }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 5px 0 0; font: inherit; }
      article { min-width: 0; padding: 14px 0; border-top: 1px solid var(--line); }
      article > label { display: flex; align-items: flex-start; gap: 9px; }
      article > label input { margin-top: 5px; accent-color: var(--accent); }
      .op-meta { display: block; color: var(--muted); font-size: 12px; margin: 5px 0; overflow-wrap: anywhere; }
      .op-blocked { color: var(--bad); }
      #status { min-height: 1.6em; white-space: pre-wrap; overflow-wrap: anywhere; }
      #revision { overflow-wrap: anywhere; }
      .empty { color: var(--muted); padding: 18px 0; }
      .pacing-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
      .pacing-item input { margin-top: 5px; accent-color: var(--accent); }
      .pacing-changes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 8px; }
      .pacing-change { min-width: 0; padding: 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 65%, transparent); }
      .pacing-change strong { display: block; color: var(--accent); font-size: 12px; }
      @media (max-width: 640px) {
        body { padding: 14px 12px 28px; }
        .panel-section { padding: 12px; }
        .diff, .pacing-changes { grid-template-columns: 1fr; }
        .toolbar > button, .toolbar > label { flex: 1 1 auto; }
      }
    </style>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <header class="topline">
      <h1 id="title">剧本助手</h1>
      <button id="language" type="button" aria-label="Switch language">English</button>
    </header>
    <p id="intro" class="intro">先生成建议，再逐条审阅。只有明确应用才会修改作品。</p>

    <section class="panel-section" aria-labelledby="script-heading">
      <div class="section-heading"><h2 id="script-heading">剧本修改</h2></div>
      <label id="instruction-label" for="instruction">修改意图</label>
      <textarea id="instruction" placeholder="例如：节奏更紧凑，强化第三幕反转。"></textarea>
      <div class="toolbar">
        <button id="propose" class="primary" type="button" disabled>生成提案</button>
        <button id="accept-all" type="button" disabled>全部接受</button>
        <button id="reject-all" type="button" disabled>全部拒绝</button>
        <button id="checkpoint" type="button" disabled>创建检查点</button>
        <button id="apply" class="primary" type="button" disabled>创建检查点并应用所选修改</button>
      </div>
      <p id="cost-note" class="subtle">生成提案会调用已配置的文本模型；进入面板不会调用模型。</p>
      <p id="revision" class="subtle"></p>
      <p id="checkpoint-state" class="subtle" role="status" aria-live="polite"></p>
      <div id="ops" aria-live="polite"><p class="empty">请从具体话的扩展菜单打开面板。</p></div>
    </section>

    <section class="panel-section" aria-labelledby="pacing-heading">
      <div class="section-heading">
        <h2 id="pacing-heading">节奏调整</h2>
        <label for="pacing-preset" id="preset-label">方案</label>
        <select id="pacing-preset" aria-label="节奏方案">
          <option value="auto">自动</option>
          <option value="compact">紧凑</option>
          <option value="lyrical">舒展</option>
          <option value="cinematic">电影感</option>
        </select>
      </div>
      <div class="toolbar">
        <button id="suggest-pacing" type="button" disabled>生成节奏建议</button>
        <button id="accept-pacing-all" type="button" disabled>全部勾选</button>
        <button id="reject-pacing-all" type="button" disabled>全部取消</button>
        <button id="apply-pacing" class="primary" type="button" disabled>应用勾选项</button>
      </div>
      <p id="pacing-status" class="subtle" role="status" aria-live="polite">尚未读取分镜。</p>
      <div id="pacing-ops"></div>
    </section>

    <p id="status" role="status" aria-live="polite">正在连接面板…</p>
  </body>
</html>
