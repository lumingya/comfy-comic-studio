<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="documentTitle">成品档精修管线</title>
    <link rel="stylesheet" href="panel.css" />
    <script src="bridge.js" defer></script>
    <script src="view.js" defer></script>
    <script src="jobs.js" defer></script>
    <script src="logic.js" defer></script>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <main>
      <h1 data-i18n="heading">成品精修</h1>
      <p class="muted" data-i18n="intro">
        让选好的画面走完已配置的放大、细节与高清处理阶段。开始前可核对顺序，完成后逐格对比。
      </p>
      <div class="toolbar">
        <button id="load" disabled data-i18n="load">读取已采用草稿与配置</button
        ><button id="new-intent" disabled data-i18n="newIntent">开始新的成品请求</button>
      </div>
      <p id="status" role="status" aria-live="polite" data-i18n="connecting">正在连接面板…</p>
      <div class="grid">
        <section class="card">
          <h2 data-i18n="selectHeading">选择需要精修的画面</h2>
          <div class="toolbar">
            <button id="all" disabled data-i18n="all">全选已采用草稿</button
            ><button id="none" disabled data-i18n="none">清空选择</button>
          </div>
          <div id="takes">
            <p class="muted" data-i18n="takesHint">
              读取后显示当前已采用的草稿。候选与已有成品不会混入。
            </p>
          </div>
          <label>
            <span data-i18n="sourceLabel">原图预览</span>
            <select id="source">
              <option value="" data-i18n="sourceOption">选择一格查看</option>
            </select></label
          >
          <div class="stage">
            <img id="source-image" data-i18n-alt="sourceAlt" alt="所选已采用草稿" />
            <span class="stage-empty" data-i18n="sourceEmpty">选择候选后显示原图</span>
          </div>
        </section>
        <section class="card">
          <h2 data-i18n="pipelineHeading">本次成品管线</h2>
          <label><span data-i18n="profileLabel">出图配置</span><select id="profile" disabled></select></label>
          <ol id="stages"></ol>
          <p id="stage-note" class="muted" data-i18n="stageNote">
            阶段来自高级出图配置，顺序与参数由服务端冻结。本面板不改动全局配置。
          </p>
          <label
            ><input
              id="consent"
              type="checkbox"
            /><span data-i18n="consent">我确认：成品成功时会替换仍被采用的原草稿；原图作为候选保留。如果期间换了采用图，不追改新的选择。</span></label
          >
          <p class="muted" data-i18n="cost">
            提交会运行选定服务，可能消耗显存或云端额度。失败与停止均不自动重试。
          </p>
          <button id="submit" class="primary" disabled>
            <span data-i18n="submit">提交所选画面的成品精修</span>
          </button>
        </section>
      </div>
      <section class="card">
          <h2 data-i18n="progressHeading">任务进度</h2>
        <label>
          <span data-i18n="recentLabel">近期成品任务</span>
          <select id="recent-jobs">
            <option value="" data-i18n="recentOption">读取后显示</option>
          </select></label
        >
        <label>
          <span data-i18n="jobIdLabel">任务 ID</span>
          <input id="job-id" data-i18n-placeholder="jobPlaceholder" placeholder="也可粘贴已有任务 ID 继续查看"
        /></label>
        <div class="toolbar">
          <button id="job-refresh" data-i18n="refresh">刷新任务</button
          ><button id="job-cancel" disabled data-i18n="stop">停止任务</button
          ><label
            ><input id="watch" type="checkbox" checked /><span data-i18n="watch">每 5 秒跟踪状态</span></label
          >
        </div>
        <progress id="job-progress" value="0" max="1"></progress>
        <p id="job-state" data-i18n="noJob">尚未选择任务</p>
        <ul id="job-items"></ul>
      </section>
      <section class="card">
          <h2 data-i18n="compareHeading">原图 / 成品对比</h2>
        <label>
          <span data-i18n="resultLabel">成品结果</span>
          <select id="result">
            <option value="" data-i18n="resultOption">完成任务后可查看</option>
          </select></label
        >
        <div id="compare-view" class="compare-view" style="--split: 50%">
          <img id="before-image" data-i18n-alt="beforeAlt" alt="成品处理前的原图" />
          <div id="after-clip" class="compare-after">
            <img id="after-image" data-i18n-alt="afterAlt" alt="成品管线处理后的画面" />
          </div>
          <span class="compare-label compare-label-before" data-i18n="beforeLabel">原草稿</span>
          <span class="compare-label compare-label-after" data-i18n="afterLabel">成品</span>
          <span id="compare-empty" class="compare-empty" data-i18n="noComparison">选择成品后显示原图与精修结果</span>
        </div>
        <div class="compare-controls">
          <label for="compare-range" data-i18n="divider">分割位置</label>
          <input id="compare-range" type="range" min="10" max="90" value="50" />
          <button id="rollback" disabled data-i18n="rollback">恢复此成品的原草稿</button>
        </div>
        <p id="result-status" class="muted" aria-live="polite" data-i18n="resultHint">成品图会在任务完成后显示。</p>
      </section>
    </main>
  </body>
</html>
