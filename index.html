function variableEditor(entries,group,id){return `${entries.length?`<table class="variable-table"><thead><tr><th>变量 / 占位符</th><th>类型</th><th>内容</th><th></th></tr></thead><tbody>${entries.map(e=>`<tr><td><div class="row" style="gap:4px"><span class="mono grow">{${esc(e.key)}}</span>${ibtn('edit','v3-variable-rename','重命名变量',`data-group="${group}" data-id="${id}" data-entry="${e.id}"`)}</div></td><td><select data-v3-var="type" data-group="${group}" data-owner="${id}" data-entry="${e.id}" aria-label="${esc(e.key)} 的类型">${Object.entries(variableTypes).map(([v,l])=>opt(v,l,e.type)).join('')}</select></td><td>${e.type==='boolean'?`<select data-v3-var="value" data-group="${group}" data-owner="${id}" data-entry="${e.id}" aria-label="${esc(e.key)} 的值">${opt('true','开启 / true',String(e.value))}${opt('false','关闭 / false',String(e.value))}</select>`:e.type==='number'?input('value',e.value,'number',`data-v3-var="value" data-group="${group}" data-owner="${id}" data-entry="${e.id}" step="any" aria-label="${esc(e.key)} 的值"`):`<textarea data-v3-var="value" data-group="${group}" data-owner="${id}" data-entry="${e.id}" aria-label="${esc(e.key)} 的值" ${e.type==='json'?'spellcheck="false"':''}>${esc(typeof e.value==='object'?JSON.stringify(e.value,null,2):e.value)}</textarea>`}</td><td>${ibtn('trash','v3-variable-delete','删除变量',`data-group="${group}" data-id="${id}" data-entry="${e.id}"`)}</td></tr>`).join('')}</tbody></table>`:'<div class="variable-empty">这里没有固定字段。按需添加角色、场景、模型强度，或工作流需要的任何参数。</div>'}<div class="row" style="padding-top:13px">${btn('添加变量','plus','v3-variable-add',`data-group="${group}" data-id="${id}"`,'small')}<span class="tiny muted">在提示词中使用 {变量名}，节点中可以直接读取类型化的值。</span></div>`}


function renderCreationWorkspace(){
  const p=selectedPlan();if(p)createUI.planId=p.id;
  const header=`<div class="creation-head">${heading('创作画册','把分镜、素材与生成计划放在一起。',btn('新建画册计划','plus','v3-plan-new')+btn('生成选中的画册','play','v3-generate-selected','','primary'),'CREATE / YOUR NEXT STORY')}<div class="creation-path"><span>画册计划</span>${icon('arrow')}<span>选择分镜</span>${icon('arrow')}<span>组合变量素材</span>${icon('arrow')}<span>生成画面</span></div></div><nav class="creation-tabs" aria-label="创作步骤">${[['plans','画册计划'],['scenes','分镜编辑'],['variables','变量素材'],['queue','生成队列']].map(([id,l])=>`<button class="${createUI.tab===id?'active':''}" data-act="v3-create-tab" data-tab="${id}" ${createUI.tab===id?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`;
  return header+({plans:renderBookPlans,scenes:renderSceneComposer,variables:renderVariableLibrary,queue:renderCreationQueue}[createUI.tab]||renderBookPlans)();
}


function renderPlanRail(){return `<aside class="creation-rail"><div class="creation-rail-head"><span>本企划的画册计划</span>${ibtn('plus','v3-plan-new','新建画册计划')}</div>${projectPlans().map(p=>`<div class="plan-list-item ${p.id===createUI.planId?'active':''}"><input type="checkbox" data-v3-plan-enabled="${p.id}" ${p.enabled?'checked':''} aria-label="勾选 ${esc(p.title)} 参与生成"><button class="plan-list-button" data-act="v3-plan-select" data-id="${p.id}"><strong>${esc(p.title)}</strong><small>${esc(templateBy(p.templateId)?.title||'尚未选择分镜')}<br>${p.variableSetIds.length} 组复用素材</small></button></div>`).join('')}${!projectPlans().length?'<p class="help">先给你的第一本画册起一个名字。</p>':''}</aside>`}


function renderBookPlans(){const p=selectedPlan();if(!p)return `<div class="empty">${icon('book')}<h3>一本画册，不止一组固定变量。</h3><p>给画册起名，选择分镜，然后自由组合角色、画风或模型参数。</p>${btn('创建第一份计划','plus','v3-plan-new','','primary')}</div>`;const t=templateBy(p.templateId);return `<div class="creation-layout">${renderPlanRail()}<div class="creation-detail"><section class="creation-section"><div class="row between"><label class="label" for="v3-plan-title">为画册起名</label><div class="row">${ibtn('copy','v3-plan-clone','复制计划，复用原有素材')}${ibtn('trash','v3-plan-delete','删除计划，不删除已生成画册')}</div></div>${input('title',p.title,'text','class="plan-name-input" id="v3-plan-title" data-v3-plan="title" placeholder="一个好故事，从名字开始"')}<p class="help">名称可以使用变量，例如「{character} 的夏天」。素材与名字独立管理。</p><div class="plan-context-grid" style="margin-top:22px">${field('使用哪套分镜？',`<select data-v3-plan="templateId" aria-label="画册使用的分镜模板"><option value="">请选择分镜模板</option>${projectTemplates().map(t=>opt(t.id,t.title+' · '+t.frames.length+' 幕',p.templateId)).join('')}</select>`)}<div><div class="label">内容编辑</div><div class="row">${btn('编辑分镜','story','v3-plan-scenes',t?'':'disabled')}${btn('新建分镜','plus','new-template','','small')}${btn('删除模板','trash','delete-storyboard-template',`data-id="${esc(t.id)}"`,'small ghost')}</div></div></div></section><section class="creation-section"><h2>组合可复用素材</h2><p>同一套角色、画风或 LoRA 参数可用于多本画册。按下方顺序合并，同名变量由后者覆盖。</p>${p.variableSetIds.map((id,i)=>{const s=setBy(id);return `<div class="variable-source-row"><span class="order-label">${pad(i+1)}</span><div class="grow"><strong>${esc(s?.title||'素材已删除')}</strong><small>${s?s.entries.map(e=>'{'+esc(e.key)+'}').join(' · '):'请移除无效引用'}</small></div>${ibtn('up','v3-set-order','向前移动素材',`data-index="${i}" data-dir="-1"`)}${ibtn('down','v3-set-order','向后移动素材',`data-index="${i}" data-dir="1"`)}${ibtn('close','v3-plan-unlink','仅从本册移除素材引用',`data-id="${id}"`)}</div>`}).join('')||'<div class="variable-empty">还没有引用素材。可直接填写本册变量，也可以复用已有素材。</div>'}<div class="row" style="padding-top:13px">${btn('选择素材','plus','v3-choose-sets','','small')}${btn('创建可复用素材','users','v3-set-new','','ghost small')}</div></section><section class="creation-section"><h2>本册专属变量</h2><p>只影响这本画册。可以添加新变量，也可以覆盖上面素材中的同名值。</p>${variableEditor(p.variables,'plan',p.id)}</section><section class="creation-section"><div class="row between"><h3>最终内容预览</h3>${btn('重新检查','refresh','v3-refresh-preview','','ghost small')}</div><div id="v3-plan-preview">${renderPlanPreview(p)}</div></section><div class="create-queue-actions"><span class="tiny muted grow">分镜与变量会在入队时拍成快照，后续修改不影响正在生成的画册。</span>${btn('只加入队列','plus','v3-enqueue-plan',t?'':'disabled')}${btn('生成这本画册','play','v3-generate-plan',t?'':'disabled','primary')}</div></div></div>`}


function renderPlanPreview(p){try{const t=templateBy(p.templateId),f=t?.frames[0],scope=effectivePlanScope(p,f),title=scopeText(p.title,effectivePlanScope(p).values),frame=f?effectivePlanFrame(p,f):null,missing=missingScopeKeys(p.title,effectivePlanScope(p).values).concat(frame?missingScopeKeys(frame.prompt+' '+frame.caption,scope.values):[]);return `${missing.length?`<div class="scope-warnings">待补充 ${[...new Set(missing)].map(k=>'{'+esc(k)+'}').join('、')}。缺少的变量会在生成前拦截，不会静默删除。</div>`:''}<div class="resolved-preview"><strong style="font-family:var(--sans);font-size:13px">${esc(title)}</strong>${frame?'\n\n'+esc(scopeText(frame.prompt,scope.values))+'\n\n'+esc(scopeText(frame.caption,scope.values)):'\n请先选择分镜模板。'}</div><div class="scope-explain">${icon('nodes')}<span>优先级：复用素材从上到下 → 本册变量 → 本幕变量。${scope.overrides.length?'本幕发生 '+scope.overrides.length+' 处同名覆盖，可在“分镜编辑”中查看。':'当前没有同名冲突。'}</span></div>`}catch(e){return '<div class="scope-warnings">'+esc(e.message)+'</div>'}}


function renderVariableLibrary(){const sets=projectVariableSets(),s=setBy(createUI.setId)&&setBy(createUI.setId).projectId===state.activeProjectId?setBy(createUI.setId):sets[0];if(s)createUI.setId=s.id;return `<div class="row between" style="margin-bottom:23px"><div><h2 style="font-size:17px;font-weight:500;margin:0 0 7px">可复用的变量素材</h2><span class="tiny muted">素材可以是一个角色、一种画风，或一套你自己的插件参数，没有固定字段。</span></div>${btn('新建素材','plus','v3-set-new','','primary')}</div>${s?`<div class="creation-layout"><aside class="creation-rail"><div class="source-set-list">${sets.map(x=>`<button class="source-set-item ${s.id===x.id?'active':''}" data-act="v3-set-select" data-id="${x.id}"><strong>${esc(x.title)}</strong><small>${x.entries.length} 个变量 · ${state.creation.plans.filter(p=>p.variableSetIds.includes(x.id)).length} 本画册使用</small></button>`).join('')}</div></aside><section class="creation-detail"><div class="row" style="margin-bottom:22px"><div class="grow">${field('素材名称',input('title',s.title,'text','data-v3-set-title="true"'))}</div>${ibtn('copy','v3-set-clone','复制为独立素材')}${ibtn('trash','v3-set-delete','删除素材并移除引用')}</div>${variableEditor(s.entries,'set',s.id)}<div class="divider"></div><h3 style="font-size:12px;font-weight:500;margin-bottom:10px">哪些画册在使用？</h3>${state.creation.plans.filter(p=>p.variableSetIds.includes(s.id)).map(p=>`<button class="variable-source-row" style="width:100%;text-align:left" data-act="v3-plan-select" data-id="${p.id}">${icon('book','sm')}<span class="grow small">${esc(p.title)}</span>${icon('arrow','sm')}</button>`).join('')||'<p class="help">尚未被画册引用。在“画册计划 → 选择素材”中加入即可。</p>'}<div class="scope-explain">${icon('shield')}<span>这里的所有变量都能增删。删除仍被引用的变量后，生成预检查会提示缺失，不会替你猜值。</span></div></section></div>`:'<div class="empty">'+icon('users')+'<h3>从一组你需要的变量开始。</h3><p>例如 character / outfit，也可以是你工作流中的任意参数。</p></div>'}`}


function renderSceneComposer(){const p=selectedPlan();let t=currentTemplate()||projectTemplates()[0];if(!t)return `<div class="empty">${icon('story')}<h3>先创建一套分镜。</h3><p>只需要提示词与台词，不必先配置景别或采样参数。</p>${btn('新建分镜模板','plus','new-template','','primary')}</div>`;ui.templateId=t.id;ui.frameIndex=clamp(ui.frameIndex,0,t.frames.length-1);const frame=t.frames[ui.frameIndex],own=createUI.sceneScope==='plan'&&p?.templateId===t.id,o=own?planFrameOverrides(p,frame):frame,shown=own?effectivePlanFrame(p,frame):frame;return `<div class="row wrap" style="margin-bottom:22px"><div style="min-width:210px;flex:1;max-width:350px">${templateSelect('v3-scene-template',t.id)}</div>${btn('新建分镜','plus','new-template','','small')}${btn('删除模板','trash','delete-storyboard-template',`data-id="${esc(t.id)}"`,'small ghost')}${btn('导入','upload','import-template','','small')}${btn('导出','download','export-template','','small')}<span class="spacer"></span><select id="v3-scene-scope" class="scene-scope-select" aria-label="分镜修改范围">${opt('shared','编辑共享分镜模板',own?'plan':'shared')}${p?.templateId===t.id?opt('plan','仅覆盖当前画册这一幕',own?'plan':'shared'):''}</select></div><div class="scope-explain" style="padding:0 0 20px">${icon('shield')}<span>${own?'只修改「'+esc(p.title)+'」这一幕，不影响复用这套分镜的其他画册。':'这是一套共享分镜，'+state.creation.plans.filter(x=>x.templateId===t.id).length+' 份计划正在使用。需要个别调整时切换为“仅覆盖当前画册”。'}</span></div><div class="scene-workspace"><aside class="scene-rail">${t.frames.map((f,i)=>`<button class="scene-item ${i===ui.frameIndex?'active':''}" data-act="scene" data-index="${i}" draggable="true" data-drag-index="${i}"><span class="scene-number">${pad(i+1)}</span><div><strong>${esc(f.name)}</strong><small>${planFrameOverrides(p,f).prompt!==undefined?'有本册覆盖':'分镜提示词与台词'}</small></div></button>`).join('')}${btn('新增一幕','plus','add-frame','','ghost small')}</aside><section class="creation-detail scene-text-editor"><div class="row between" style="margin-bottom:18px"><span class="eyebrow" style="margin:0">SCENE ${pad(ui.frameIndex+1)} / ${pad(t.frames.length)}</span><div class="row">${ibtn('up','move-frame','向前移动分镜','data-dir="-1"')}${ibtn('down','move-frame','向后移动分镜','data-dir="1"')}${ibtn('copy','clone-frame','复制本幕')}${ibtn('trash','delete-frame','删除本幕')}</div></div>${field('这一幕叫什么？',input('name',shown.name,'text','data-v3-frame="name"'))}${field('画面提示词',`<textarea id="frame-prompt" data-v3-frame="prompt" placeholder="描述人物、场景、镜头和氛围，所有构图都由你的提示词决定。">${esc(shown.prompt)}</textarea>`,'可以使用 {变量名}。景别、角度、风格均可直接写入提示词，无额外固定控件。')}${field('剧情台词 / 旁白',`<textarea class="caption-editor" data-v3-frame="caption" placeholder="不需要旁白时可以留空。">${esc(shown.caption)}</textarea>`)}${own?btn('清除此幕覆盖，恢复模板','refresh','v3-clear-scene','','small ghost'):''}<details class="advanced-details"><summary>${icon('nodes')}此幕的变量覆盖</summary><p class="help">可为这一幕更换服装、场景或 LoRA 强度。同名值只在这一幕优先。</p>${p?.templateId===t.id?variableEditor(planFrameOverrides(p,frame).variables||[],'scene',p.id):'<p class="help">先为当前画册选择这套分镜，即可添加单幕覆盖。</p>'}</details><details class="advanced-details"><summary>${icon('settings')}高级选项：负向词与渲染覆盖</summary>${field('负向提示词（留空则继承）',`<textarea data-v3-frame="negative" style="min-height:70px">${esc(shown.negative||'')}</textarea>`)}<label class="row small soft" style="margin:15px 0"><input type="checkbox" id="v3-render-override" ${shown.renderOverride?'checked':''}>启用此幕渲染规格覆盖</label><p class="help">默认关闭，保持工作流中的原始参数。启用后，只有已映射为“分镜参数”的输入项会接收这些值。</p>${shown.renderOverride?`<div class="editor-options">${[['width','宽度',256,4096,64],['height','高度',256,4096,64],['steps','采样步数',1,150,1],['cfg','CFG',0,30,.1],['denoise','Denoise',0,1,.05],['seed','Seed / -1 随机',-1,9007199254740991,1]].map(([k,l,min,max,step])=>field(l,input(k,shown[k]??makeFrame()[k],'number',`data-v3-frame="${k}" min="${min}" max="${max}" step="${step}"`))).join('')}</div>`:''}<div style="margin-top:15px">${btn('配置对应节点输入','nodes','v3-settings-tab','data-tab="mapping"','small')}</div></details>${!own?`<details class="advanced-details"><summary>${icon('story')}分镜模板信息</summary>${field('模板名称',input('title',t.title,'text','data-v3-template="title"'))}${field('故事主线',`<textarea data-v3-template="outline" style="min-height:80px">${esc(t.outline)}</textarea>`)}</details>`:''}<div class="scene-mini-preview"><div class="row between"><h3 style="font-size:12px;font-weight:500">当前画册的替换结果</h3>${btn('刷新预览','refresh','v3-refresh-preview','','ghost small')}</div><div id="v3-scene-preview">${p&&p.templateId===t.id?sceneResolvedPreview(p,frame):'<p class="help">选择使用这套分镜的画册计划后，可查看变量替换结果。</p>'}</div></div></section></div>`}


function sceneResolvedPreview(p,f){try{const frame=effectivePlanFrame(p,f),scope=effectivePlanScope(p,f),missing=missingScopeKeys(frame.prompt+' '+frame.caption,scope.values);return `${missing.length?'<div class="scope-warnings">待填写 '+missing.map(k=>'{'+esc(k)+'}').join('、')+'</div>':''}<div class="resolved-preview">${esc(scopeText(frame.prompt,scope.values))}\n\n${esc(scopeText(frame.caption,scope.values))}</div><div class="help">${Object.entries(scope.sources).map(([key,source])=>'{'+esc(key)+'} ← '+esc(source)).join(' · ')}</div>`}catch(e){return '<div class="scope-warnings">'+esc(e.message)+'</div>'}}


function renderCreationQueue(){return `<div class="row wrap" style="margin-bottom:21px"><div class="grow"><h2 style="font-size:17px;font-weight:500;margin:0 0 8px">生成队列</h2><span class="tiny muted">入队后使用当时的分镜、变量和工作流快照，可暂停、继续或增量补齐。</span></div>${btn('开始队列','play','v3-run-queue','','primary')}${btn(rt.paused?'继续':'暂停',rt.paused?'play':'pause','pause-queue')}${btn('中止','stop','interrupt','','danger')}</div><div class="panel table-panel" id="queue-list">${queueHTML()}</div><div class="row" style="margin-top:18px">${btn('查找缺失分镜','refresh','scan-resume','','small')}${btn('查看运行日志','terminal','v3-nav','data-route="logs"','small ghost')}</div>`}


function renderLogsWorkspace(){return `<div class="logs-full">${heading('运行日志','按时间查看生成、连接、保存和审校的真实运行记录。',btn('复制日志','copy','copy-logs')+btn('清空本次显示','trash','v3-clear-logs'),'ACTIVITY / EXECUTION')}<div class="logs-filter"><input id="v3-log-search" placeholder="搜索任务、错误或关键词..." value="${esc(createUI.logsSearch)}" aria-label="搜索运行日志"><select id="v3-log-level">${[['all','全部级别'],['error','错误'],['warn','警告'],['info','普通']].map(x=>opt(...x,createUI.logLevel)).join('')}</select><span class="spacer"></span>${btn('打开生成队列','nodes','v3-create-tab','data-tab="queue"','small')}</div><div class="terminal"><div class="terminal-head">${icon('terminal','sm')}LIVE ACTIVITY<span class="spacer"></span><span id="v3-log-count">${rt.logs.length} 条</span></div><div id="log-body" class="terminal-body"></div></div></div>`}


function renderNodeBrowser(){const workflow=state.settings.comfy.workflow,search=createUI.nodeSearch.toLowerCase();return `<aside class="mapping-browser"><input id="v3-node-search" value="${esc(createUI.nodeSearch)}" placeholder="搜索节点 / LoRA / 字段..." aria-label="搜索工作流节点"><div id="v3-node-results">${nodeBrowserItems(workflow,search)}</div></aside>`}


function nodeBrowserItems(workflow,search){return Object.entries(workflow).filter(([id,n])=>(id+' '+n.class_type+' '+(n._meta?.title||'')+' '+Object.keys(n.inputs).join(' ')).toLowerCase().includes(search)).map(([id,n])=>`<details class="node-group" ${search?'open':''}><summary>#${esc(id)} · ${esc(n._meta?.title||n.class_type)}<small>${esc(n.class_type)}</small></summary>${workflowInputEntries(n,workflow).map(entry=>`<div class="node-input-item"><span class="grow ${entry.link?'linked':''}" title="${esc(JSON.stringify(entry.value))}">${esc(entry.label)} <span style="opacity:.5">${entry.link?'连线':entry.type}</span></span>${ibtn('plus','v3-expose-input',entry.link?'将此连线添加为待确认映射':'添加此字段到映射表',`data-node="${esc(id)}" data-path="${esc(entry.path)}"`)}</div>`).join('')}</details>`).join('')||'<div class="mapping-list-empty">未找到匹配节点。</div>'}


function renderMappingRule(binding,index){const w=state.settings.comfy.workflow,n=w[binding.nodeId],valid=bindingRowValidity(binding),fieldId='field-'+binding.id,fields=n?workflowInputEntries(n,w):[];return `<article class="mapping-rule"><div class="mapping-rule-title"><input type="checkbox" data-v3-binding="enabled" data-id="${binding.id}" ${binding.enabled?'checked':''} aria-label="启用映射 ${esc(binding.label)}"><span class="mono tiny muted">${pad(index+1)}</span>${input('label',binding.label,'text',`data-v3-binding="label" data-id="${binding.id}" aria-label="映射显示名称"`)}${ibtn('trash','v3-remove-binding','仅删除映射项，不删除原工作流节点',`data-id="${binding.id}"`)}</div><div class="mapping-target">${field('节点 ID（可手动填）',input('nodeId',binding.nodeId,'text',`data-v3-binding="nodeId" data-id="${binding.id}" list="v3-node-ids" placeholder="例如 42"`))}${field('输入字段 / 路径',input('path',binding.path,'text',`data-v3-binding="path" data-id="${binding.id}" list="${fieldId}" placeholder="text 或 /loras/0/strength"`))}${field('值类型',`<select data-v3-binding="type" data-id="${binding.id}">${Object.entries(bindingTypes).map(x=>opt(...x,binding.type)).join('')}</select>`)}</div><datalist id="${fieldId}">${fields.map(f=>`<option value="${esc(f.path.slice(1).includes('/')?f.path:f.path.slice(1))}">${esc(f.type+(f.link?' / 连线':''))}</option>`).join('')}</datalist><div class="mapping-source">${field('值从哪里来？',`<select data-v3-binding="source" data-id="${binding.id}">${Object.entries(bindingSources).map(x=>opt(...x,binding.source)).join('')}</select>`)}${['literal','variable','sceneParameter'].includes(binding.source)?field(binding.source==='variable'?'变量名（任意自定义变量）':binding.source==='sceneParameter'?'分镜参数名':'自定义内容（支持 {变量名}）',binding.source==='literal'&&binding.type==='json'?`<textarea data-v3-binding="value" data-id="${binding.id}" spellcheck="false">${esc(binding.value)}</textarea>`:input('value',binding.value,'text',`data-v3-binding="value" data-id="${binding.id}" ${binding.source==='sceneParameter'?'list="v3-render-parameters"':''} placeholder="${binding.source==='variable'?'例如 lora_strength':binding.source==='sceneParameter'?'例如 width / steps':'固定值或 {变量名}'}"`)):`<div class="mapping-resolved" style="padding-top:22px">${binding.source==='sceneParameter'?'只有单幕高级覆盖开启时生效。':'此来源会按每一幕自动传入，无需重复填写。'}</div>`}</div><div class="mapping-resolved ${valid.ok?'':'danger'}">${valid.ok?icon('check','sm'):icon('help','sm')} ${esc(valid.text)}</div>${binding.warning?`<div class="mapping-warning">${esc(binding.warning)}</div>`:''}<details class="advanced-details" style="margin-top:12px;padding-top:10px"><summary>${icon('settings')}映射高级控制</summary><div class="row wrap"><label class="row tiny soft"><input type="checkbox" data-v3-binding="allowCreate" data-id="${binding.id}" ${binding.allowCreate?'checked':''}>允许新增此可选输入字段</label><label class="row tiny soft"><input type="checkbox" data-v3-binding="allowLink" data-id="${binding.id}" ${binding.allowLink?'checked':''}>允许覆盖原节点连线</label>${['positive','negative'].includes(binding.source)?btn('重新识别文本字段','refresh','v3-infer-field',`data-id="${binding.id}"`,'small'):''}</div><p class="help">JSON 路径以 / 开头，支持嵌套对象和数组。覆盖连线会改变拓扑，请仅在明确知道节点要求时开启。</p></details></article>`}

async function previewMappedSubmission(){const p=selectedPlan();if(!p)throw Error('先创建画册计划，填写变量后预览真实提交。');const t=templateBy(p.templateId);if(!t)throw Error('画册计划还没有选分镜。');const row=planRuntimeRow(p),frame=effectivePlanFrame(p,t.frames[clamp(ui.frameIndex,0,t.frames.length-1)]),compiled=buildMappedWorkflow(frame,row,{execution:mappedExecutionSnapshot(),preview:true});modal('工作流提交预览',`<p class="help">${esc(p.title)} · 只预览，不提交 GPU。随机种子用固定示例值展示。</p><div class="notice">已覆写 ${compiled.changes.length} 项。未映射或关闭的字段保持原工作流值。</div><pre class="mapping-preview-code">${esc(JSON.stringify(compiled.workflow,null,2))}</pre><div class="modal-footer">${btn('复制 JSON','copy','v3-copy-submission')}${btn('关闭','','close-modal','','primary')}</div>`,'先检查最终参数，再开始生成。',true);createUI.lastSubmission=compiled.workflow}


async function mappedDryRun(){const p=selectedPlan(),t=p?templateBy(p.templateId):currentTemplate();if(!t)throw Error('请先创建分镜。');const row=p?planRuntimeRow(p):projectRows()[0];if(!row)throw Error('请先创建一个画册计划。');const f=p?effectivePlanFrame(p,t.frames[0]):clone(t.frames[0]);f._execution=mappedExecutionSnapshot();createUI.dryController=new AbortController();const area=$('#dry-preview');if(area)area.innerHTML='<p><i class="dot live"></i> 正在验证映射并生成一帧...</p>';try{const result=await generateFrame(f,row,createUI.dryController.signal,0);rt.preview=result.image;if($('#dry-preview'))$('#dry-preview').innerHTML=imgTag(result.image,'通用映射试跑结果');toast(result.offlineFallback?'真实服务失败，当前显示明确标记的离线降级图。':'映射试跑完成。')}catch(e){if($('#dry-preview'))$('#dry-preview').textContent=e.message;throw e}finally{createUI.dryController=null}}

function renderAssistantOrb(){
  const orb=$('.assistant-launch');orb.classList.add('assistant-orb');orb.innerHTML=icon('spark')+'<span class="orb-copy"><strong>分镜精修助手</strong><small>用自然语言改提示词与台词</small></span>';orb.setAttribute('aria-label','拖动悬浮球，点击打开分镜精修助手');orb.hidden=!featureEnabled('assistant');
  if(!orb.dataset.orbInitialized){orb.dataset.orbInitialized='true';const p=state.settings.studio.shell.orbPosition;if(p){orb.style.right=clamp(p.right,12,innerWidth-58)+'px';orb.style.bottom=clamp(p.bottom,40,innerHeight-60)+'px'}
    orb.addEventListener('pointerdown',e=>{if(e.button!==0)return;const start={x:e.clientX,y:e.clientY,right:innerWidth-orb.getBoundingClientRect().right,bottom:innerHeight-orb.getBoundingClientRect().bottom};let moved=false;orb.setPointerCapture(e.pointerId);orb.onpointermove=event=>{const dx=event.clientX-start.x,dy=event.clientY-start.y;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;createUI.orbDragging=true;orb.classList.add('orb-dragging');orb.style.right=clamp(start.right-dx,12,Math.max(12,innerWidth-58))+'px';orb.style.bottom=clamp(start.bottom-dy,40,Math.max(40,innerHeight-58))+'px';orb.style.left='auto';orb.style.top='auto'};orb.onpointerup=orb.onpointercancel=()=>{orb.onpointermove=null;orb.classList.remove('orb-dragging');createUI.orbDragging=false;if(moved){createUI.orbIgnoreClick=true;state.settings.studio.shell.orbPosition={right:parseFloat(orb.style.right)||20,bottom:parseFloat(orb.style.bottom)||48};save();setTimeout(()=>createUI.orbIgnoreClick=false,100)}}});
    orb.addEventListener('pointerenter',()=>{if(createUI.orbDragging)return;const right=parseFloat(orb.style.right)||27;createUI.orbHoverRight=right;orb.style.right=clamp(right,12,Math.max(12,innerWidth-222))+'px'});orb.addEventListener('pointerleave',()=>{if(createUI.orbDragging)return;const right=state.settings.studio.shell.orbPosition?.right??createUI.orbHoverRight??27;orb.style.right=clamp(right,12,Math.max(12,innerWidth-58))+'px'});
  }
}

function commandIndexV3(query){
  const all=[
    {title:'画册集',type:'主功能',icon:'book',run:()=>navigate(0)},
    {title:'创作画册',type:'主功能',icon:'story',run:()=>navigate(1)},
    {title:'设置',type:'主功能',icon:'settings',run:()=>navigate(5)},
    {title:'工作流配置',type:'设置',icon:'nodes',run:()=>{studioUI.settingsTab='mapping';navigate(5)}},
    {title:'扩展功能',type:'主功能',icon:'nodes',run:()=>navigate(7)},
    {title:'工具与资源',type:'设置',icon:'box',run:()=>{studioUI.settingsTab='resources';navigate(5)}},
    {title:'快速开始教程',type:'帮助',icon:'help',run:()=>openQuickStart(0)}
  ];
  if(state.settings.studio.visibility.logs)all.push({title:'运行日志',type:'主功能',icon:'terminal',run:()=>navigate(6)});
  if(state.settings.studio.visibility.llm)all.push({title:'AI 写故事',type:'可选工具',icon:'spark',run:()=>navigate(4)});
  for(const p of state.creation.plans)all.push({title:p.title,type:'画册草稿',icon:'story',run:()=>{changeProject(p.projectId);createUI.planId=p.id;createUI.tab='plans';navigate(1)}});
  for(const b of state.books)all.push({title:b.title,type:'已生成画册',icon:'book',run:()=>openReader(b.id)});
  for(const t of state.templates)all.push({title:t.title,type:'分镜模板',icon:'story',run:()=>{changeProject(t.projectId);ui.templateId=t.id;createUI.tab='scenes';navigate(1)}});
  rt.commandItems=all.filter(x=>(x.title+' '+x.type+' '+localeString(x.title)).toLowerCase().includes(query.toLowerCase())).slice(0,50);
  rt.commandIndex=clamp(rt.commandIndex,0,Math.max(0,rt.commandItems.length-1));
  $('#command-results').innerHTML=rt.commandItems.map((x,i)=>`<button class="command-item ${i===rt.commandIndex?'active':''}" data-act="run-command" data-index="${i}">${icon(x.icon)}<span>${esc(x.title)}</span><small>${esc(x.type)}</small></button>`).join('')||'<div class="empty">没有匹配结果。</div>';
}

async function importGenericWorkflowLink(){const raw=$('#raw-url')?.value.trim();if(!raw)throw Error('请填写资源链接。');let url=new URL(raw);if(!['https:','http:'].includes(url.protocol)||url.username||url.password)throw Error('请输入可信的 HTTP(S) 地址。');if(url.hostname==='github.com'&&url.pathname.includes('/blob/'))url=new URL('https://raw.githubusercontent.com'+url.pathname.replace('/blob/','/'));if(url.hostname==='gitee.com')url.pathname=url.pathname.replace('/blob/','/raw/');const text=await(await request(url.href,{},15000)).text();let data;try{data=JSON.parse(text)}catch(e){return v3Core.importRaw()}if(data.kind!=='comfycomic.workflow-mappings')return v3Core.importRaw();validateBindings(data.bindings);validateWorkflow(data.workflow);if(!await confirmAction('安装通用节点映射包？','将替换当前工作流和映射。已入队任务不受影响，请先备份当前映射。','安装映射包'))return;importWorkflowIntoMapper(data);state.settings.comfy.randomizeSeeds=!!data.randomizeSeeds;save();closeModal()}

function installNativeUIModule(){const ns=globalThis.ComfyComic,scenePrevious=renderSceneComposer;renderSceneComposer=function(){const t=currentTemplate();if(t&&!t.frames?.length)return'<div class="empty">'+icon('story')+'<h3>分镜列表为空</h3><p>空模板可以正常保存。添加第一幕后即可编辑和生成，最多支持512幕。</p>'+btn('添加第一幕','plus','add-frame','','primary')+btn('删除模板','trash','delete-storyboard-template',`data-id="${esc(t.id)}"`,'small ghost')+'</div>';return scenePrevious()};const readerPrevious=openReader;openReader=function(id){const b=bookBy(id);if(!b)throw Error('The book no longer exists.');if(!b.totalSteps&&!b.steps?.length){modal(b.title||'空画册','<div class="empty"><h3>还没有分镜</h3><p>这本画册已正常读取，目前没有可阅读的图片。</p></div><div class="modal-footer">'+btn('关闭','','close-modal','','primary')+'</div>');return}return readerPrevious(id)};renderPythonSettings=function(){return'<section class="settings-section"><h2>Python 原生配置同步</h2><p>同源读取和保存已自动配置，无需填写接口路径。</p><div class="service-context"><strong>GET /api/config</strong><br><strong>POST /api/config</strong><br>10 个必填字段顶层平铺，删除时透传 forceWrite。</div><div class="row wrap" style="margin:18px 0">'+btn('重新读取后端','refresh','v3-connect-backend')+btn('立即保存','disk','v3-save-backend','','primary')+'</div><p class="help">'+esc(backendRuntime.error||'新编辑会清除旧网络错误并重新安排保存。未读取成功前不会覆盖后端数据。')+'</p></section><section class="settings-section"><h2>ComfyUI 服务</h2><div class="grid2">'+field('运行模式','<select data-setting="comfy.mode">'+opt('mock','离线预览',state.settings.comfy.mode)+opt('real','真实 ComfyUI',state.settings.comfy.mode)+'</select>')+field('ComfyUI 地址',setting('comfy.baseUrl',state.settings.comfy.baseUrl))+'</div><div class="row">'+btn('测试连接','refresh','test-engine')+btn('智能节点映射','nodes','v3-settings-tab','data-tab="mapping"')+'</div></section>'};const renderPrevious=render;render=function(){const result=renderPrevious();document.querySelectorAll('input[id="story-target"]').forEach(e=>e.max=String(ns.MAX_FRAMES));document.querySelectorAll('[data-v3-binding="allowLink"]').forEach(e async function nativeContractDiagnostics(){
  const ns=globalThis.ComfyComic,results=[],test=async(name,fn)=>{try{if(await fn()===false)throw Error('Assertion failed.');results.push({name,passed:true})}catch(e){results.push({name,passed:false,message:e.message})}};
  const empty={templates:[],savedGalleries:{books:[]},batchMatrix:{rows:[]},comfyWorkflows:[],comfyConfig:{},llmConfig:{},xmlConfig:{},chatConfig:{},uiConfig:{},batchRunState:{},updatedAt:1};
  await test('原生平铺10字段，不包装 state',()=>{const p=ns.converters.toApi(ns.converters.fromApi(empty,state),empty);return !Object.hasOwn(p,'state')&&ns.stateContract.requiredFields.every(k=>Object.hasOwn(p,k))});
  await test('空模板、角色和画册不会恢复示例数据',()=>{const s=ns.converters.fromApi(empty,state);return s.templates.length===0&&s.rows.length===0&&s.books.length===0});
  await test('512幕通过，513幕拒绝',()=>{ns.stateContract.assertFrameCount(new Array(512).fill({}));try{ns.stateContract.assertFrameCount(new Array(513).fill({}));return false}catch(e){return true}});
  await test('WeiLin positive 与 SDXL text_g 自动识别',()=>ns.textNodes.detect({inputs:{positive:'',text:['6',0]}}).field==='positive'&&ns.textNodes.detect({inputs:{text_g:'',text_l:''}}).field==='text_g');
  await test('连线数组禁止被普通值覆盖',()=>{try{ns.textNodes.healBinding({enabled:true,source:'literal',nodeId:'1',path:'text',allowLink:true},{'1':{inputs:{text:['6',0]}}});return false}catch(e){return true}});
  await test('新编辑重试 POST，并保留 forceWrite',async()=>{let attempts=0;const sent=[],mock=createNativeConfigSync({contract:ns.stateContract,convert:ns.converters,defaults:()=>state,getState:()=>state,validate:()=>true,enabled:()=>true,fetch:async(_,r)=>{if(r.method==='GET')return{ok:true,status:200,json:async()=>empty};sent.push(JSON.parse(r.body));return++attempts===1?{ok:false,status:503}:{ok:true,status:204}}});await mock.read();mock.markDirty(true);await mock.save();mock.markDirty();if(mock.runtime.error)return false;return await mock.save()&&sent.length===2&&sent.every(p=>p.forceWrite===true)});
  modal('原生接口与512幕回归检查','<div class="notice">使用隔离的模拟 HTTP 响应，不访问 Python 后端。</div>'+results.map(r=>'<div class="template-check-row"><span class="'+(r.passed?'accent':'danger')+'">'+icon(r.passed?'check':'close')+'</span><div class="grow">'+esc(r.name)+(r.message?'<small>'+esc(r.message)+'</small>':'')+'</div></div>').join('')+'<div class="modal-footer">'+btn('关闭','','close-modal','','primary')+'</div>','',true);return results;
}

function createCollectionDisplayModel(){
  const validModes=new Set(['showcase','grid']);
  function mode(value){return validModes.has(value)?value:'showcase'}
  function page(total,requested=0,pageSize=24){const size=Math.max(1,Number(pageSize)||24),count=Math.max(0,Number(total)||0),pages=Math.max(1,Math.ceil(count/size)),index=Math.max(0,Math.min(pages-1,Math.floor(Number(requested)||0)));return{index,pages,start:index*size,end:Math.min(count,(index+1)*size),total:count}}
  function fit(width,height,maxWidth,maxHeight,upscale=true){if(![width,height,maxWidth,maxHeight].every(value=>Number.isFinite(value)&&value>0))return{width:0,height:0,scale:0};const scale=Math.min(maxWidth/width,maxHeight/height,upscale?Infinity:1);return{width:width*scale,height:height*scale,scale}}
  return Object.freeze({mode,page,fit});
}

function localeExcludedElement(element){return !element||!!element.closest('script,style,textarea,input,pre,code,[data-user-content],[data-no-translate],.chat-bubble,.prompt-surface,.prompt-resolved,.resolved-preview,.mapping-preview-code,.publish-link,.room-caption,.room-scene-title,.book-desc,.book-title,#log-body,.terminal-body,.assistant-tool-detail')}


function localizeWorkspace(root=document.body){
  if(!displayUI.locale||displayUI.localizing||!root)return;displayUI.localizing=true;const pending=displayUI.observer?.takeRecords();if(pending?.length)queueLocalization(pending);displayUI.observer?.disconnect();
  try{
    const interfaceOnly=root.closest?.('#market-content,#ui-tooltip,#statusbar');
    const values=new Set();for(const item of interfaceOnly?[]:[...state.projects,...state.books,...state.templates,...state.rows,...(state.creation?.plans||[]),...(state.creation?.variableSets||[])]){for(const key of ['title','character','characterName','synopsis','outline'])if(typeof item[key]==='string')values.add(item[key]);const frames=Array.isArray(item.frames)?item.frames:Array.isArray(item.steps)?item.steps:[];for(const f of frames)for(const key of ['name','prompt','caption'])if(typeof f?.[key]==='string')values.add(f[key])}values.add(workspaceName());
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
    while((node=walker.nextNode())){const element=node.parentElement;if(localeExcludedElement(element)||!node.nodeValue?.trim())continue;const current=node.nodeValue,stored=displayUI.originalText.get(node);if(values.has(current.trim())&&!stored)continue;const source=stored&&current===stored.output?stored.source:current;const output=displayUI.locale.translate(textualInterfaceCopy(source));if(current!==output)node.nodeValue=output;displayUI.originalText.set(node,{source,output})}
    for(const el of [...(root.matches?.('[title],[placeholder],[aria-label]')?[root]:[]),...root.querySelectorAll('[title],[placeholder],[aria-label]')]){if(el.closest('script,style,pre,code,[data-user-content],[data-no-translate],.publish-link'))continue;let records=displayUI.originalAttrs.get(el)||{};for(const attr of ['title','placeholder','aria-label']){if(!el.hasAttribute(attr))continue;const current=el.getAttribute(attr),old=records[attr],source=old&&current===old.output?old.source:current,output=displayUI.locale.translate(textualInterfaceCopy(source));if(output!==current)el.setAttribute(attr,output);records[attr]={source,output}}displayUI.originalAttrs.set(el,records)}
  }finally{displayUI.localizing=false;displayUI.observer?.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder','aria-label']})}
}


function queueLocalization(records){
  displayUI.pendingLocaleRoots??=new Set();
  const add=node=>{const el=node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement;if(!el?.isConnected||el.closest('script,style,pre,code,[data-user-content],[data-no-translate]'))return;for(const current of displayUI.pendingLocaleRoots){if(current.contains(el))return;if(el.contains(current))displayUI.pendingLocaleRoots.delete(current)}displayUI.pendingLocaleRoots.add(el)};
  if(!records)add(document.body);else for(const record of records){if(record.type==='childList')record.addedNodes.forEach(add);else add(record.target)}
  if(displayUI.localeFramePending||!displayUI.pendingLocaleRoots.size)return;
  displayUI.localeFramePending=true;displayUI.frame=requestAnimationFrame(()=>{displayUI.localeFramePending=false;const roots=[...displayUI.pendingLocaleRoots];displayUI.pendingLocaleRoots.clear();for(const root of roots)if(root.isConnected)localizeWorkspace(root)});
}

function createReaderPresentationModel(totalSteps = 0, mode = 'webtoon') {
  const state = { total: Math.max(0, Number(totalSteps) || 0), index: 0, mode, info: false, filmstrip: false };
  const seek = index => {
    state.index = Math.max(0, Math.min(Math.max(0, state.total - 1), Number(index) || 0));
    return state.index;
  };
  return {
    state,
    seek,
    next() { return seek(state.index + (state.mode === 'spread' ? 2 : 1)); },
    previous() { return seek(state.index - (state.mode === 'spread' ? 2 : 1)); },
    setMode(next) { if (['spread', 'webtoon', 'gallery'].includes(next)) state.mode = next; },
    spread() {
      const first = Math.floor(state.index / 2) * 2;
      return [first < state.total ? first : null, first + 1 < state.total ? first + 1 : null];
    }
  };
}

}

/* Workflow library, per-scene assignments and immutable queue configuration. */
'use strict';

function workflowLibraryEnsure(s=state){
  const c=s.settings.comfy;
  c.presets??=[];
  const used=new Set();
  for(const p of c.presets){if(!p.id||used.has(p.id))p.id=uid('wf');used.add(p.id)}
  if(!c.activeWorkflowId||!c.presets.some(p=>p.id===c.activeWorkflowId)){
    const p={id:uid('wf'),title:c.workflowTitle||'默认工作流',workflow:clone(c.workflow),mapping:clone(c.mapping||{}),bindings:clone(c.bindings||[]),outputNodeId:c.outputNodeId||'',randomizeSeeds:!!c.randomizeSeeds};
    c.presets.push(p);c.activeWorkflowId=p.id;
  }
  s.settings.studio.visibility.extensions??=false;
}

function storeActiveWorkflow(){
  const c=state.settings.comfy,p=c.presets.find(x=>x.id===c.activeWorkflowId);
  if(!p)return;
  Object.assign(p,{title:c.workflowTitle,workflow:clone(c.workflow),mapping:clone(c.mapping||{}),bindings:clone(c.bindings||[]),outputNodeId:c.outputNodeId||'',randomizeSeeds:!!c.randomizeSeeds,updatedAt:Date.now()});
}

function workflowExecutionFor(plan,frame){
  const c=state.settings.comfy,id=planFrameOverrides(plan,frame||{}).workflowId||plan?.workflowId||c.activeWorkflowId;
  if(id===c.activeWorkflowId)return {...mappedExecutionSnapshot(),workflowId:id};
  const p=c.presets.find(w=>w.id===id);
  if(!p)throw Error('所选工作流已删除，请重新选择。');
  return {workflowId:id,workflowTitle:p.title,workflow:clone(p.workflow),bindings:clone(p.bindings||initialWorkflowBindings({...c,...p})),outputNodeId:p.outputNodeId||'',randomizeSeeds:!!p.randomizeSeeds,globalNegative:state.settings.negative,baseUrl:c.baseUrl,mode:c.mode,autoFallback:c.autoFallback,objectInfo:clone(Object.fromEntries([...new Set(Object.values(p.workflow).map(n=>n.class_type))].filter(key=>c.objectInfo?.[key]).map(key=>[key,c.objectInfo[key]])))};
}

function selectLibraryWorkflow(id){
  storeActiveWorkflow();const c=state.settings.comfy,p=c.presets.find(x=>x.id===id);
  if(!p)throw Error('工作流不存在。');
  c.activeWorkflowId=id;c.workflow=clone(p.workflow);c.workflowTitle=p.title;c.mapping=clone(p.mapping||{});
  c.bindings=clone(p.bindings||initialWorkflowBindings({...c,...p}));c.outputNodeId=p.outputNodeId||'';c.randomizeSeeds=!!p.randomizeSeeds;
  createUI.nodeSearch='';save();render();
}

function parseLibraryWorkflow(data,title){
  if(!data||typeof data!=='object')throw Error('不是有效的 JSON 工作流。');
  const workflow=data.workflow||data.prompt||data;
  if(Array.isArray(workflow.nodes))throw Error('这是 ComfyUI 编辑器格式，请导出 API 格式后导入。');
  validateWorkflow(workflow);
  const c=state.settings.comfy,p={id:uid('wf'),title:String(data.title||data.workflowTitle||title||'导入工作流'),workflow:clone(workflow),mapping:clone(data.mapping||{}),bindings:[],outputNodeId:String(data.outputNodeId||''),randomizeSeeds:!!data.randomizeSeeds};
  if(Array.isArray(data.bindings)){validateBindings(data.bindings);p.bindings=clone(data.bindings)}
  else {
    const nodes=Object.entries(workflow),texts=nodes.filter(([,n])=>/TextEncode|Prompt/i.test(n.class_type)&&Object.values(n.inputs).some(v=>typeof v==='string'));
    const neg=texts.find(([,n])=>/negative|负/i.test(n._meta?.title||''))||(texts.length>1?texts[1]:null),pos=texts.find(x=>x!==neg);
    p.mapping.positive=pos?.[0]||'';p.mapping.negative=neg?.[0]||'';
    p.bindings=initialWorkflowBindings({...c,...p});
  }
  p.outputNodeId||=Object.entries(workflow).find(([,n])=>/SaveImage|PreviewImage/.test(n.class_type))?.[0]||'';
  return p;
}

function importWorkflowIntoMapper(data){
  const p=parseLibraryWorkflow(data);storeActiveWorkflow();state.settings.comfy.presets.push(p);selectLibraryWorkflow(p.id);navigate(3);toast('已作为独立工作流导入，请核对节点映射。');
}

async function importWorkflowFiles(files){
  const accepted=[],errors=[];
  for(const file of files){
    try{
      if(file.size>10*1024*1024)throw Error('文件超过 10 MB');
      const data=JSON.parse(await file.text()),items=Array.isArray(data)?data:Array.isArray(data.workflows)?data.workflows:[data];
      if(items.length>200)throw Error('每个文件最多包含 200 份工作流');
      for(let i=0;i<items.length;i++)try{accepted.push(parseLibraryWorkflow(items[i],file.name.replace(/\.json$/i,'')+(items.length>1?' · '+(i+1):'')))}catch(e){errors.push(file.name+' #'+(i+1)+'：'+e.message)}
    }catch(e){errors.push(file.name+'：'+e.message)}
  }
  storeActiveWorkflow();state.settings.comfy.presets.push(...accepted);
  if(accepted.length)selectLibraryWorkflow(accepted[0].id);
  save();render();
  modal('批量导入结果',`<p>成功导入 ${accepted.length} 份工作流。每份独立保存节点与映射，同名文件不会覆盖已有工作流。</p>${errors.length?'<div class="notice amber">'+errors.map(esc).join('<br>')+'</div>':'<p class="help">自动识别仅作为初始映射，请核对正负提示词及输出节点。</p>'}<div class="modal-footer">${btn('完成','check','close-modal','','primary')}</div>`);
  return {accepted,errors};
}

handleAction=async function(act,d={},el){
  if(act==='run-command'&&$('#template-studio').open){$('#command-dialog').close();if(!await closeTemplateStudio())return}
  if(act==='workspace'&&$('#template-studio').open&&!await closeTemplateStudio())return;
  if(['market','et-market','et-export-market','et-settings-market','et-market-preview','et-market-download','market-install','import-raw'].includes(act)&&!featureEnabled('marketplace')){toast('模板市场已停用，可在工作室设置中重新启用。');return}
  if(['assistant','send-chat','new-chat','chat-attach','assistant-suggestion'].includes(act)&&!featureEnabled('assistant')){toast('分镜精修助手已停用。');return}
  if(['batch-story','script-regenerate','generate-story','regenerate-scene','generate-xml','generate-outline','llm-tab'].includes(act)&&!workspaceVisible(4)){toast('剧情策划工作区已隐藏，请在模块设置中启用后操作。');return}
  if(Object.hasOwn(studioActions,act)){await studioActions[act](d,el);applyStudioPreferences();return}
  if(act==='market-install'&&exportMarketCatalog.some(c=>c.id===d.id)){await installExportPackage(d.id);return}
  await studioCore.handleAction(act,d,el);applyStudioPreferences();
  if(act==='backup'){const n=$('#modal-body .notice');if(n)n.textContent+=' 自定义画册 HTML 模板、模块开关与界面设置也会包含在工程备份中。'}
};

  if(e.key==='Escape'&&detailUI.projectOpen){e.preventDefault();e.stopImmediatePropagation();closeProjectPopover();$('#project-switch-button')?.focus();return}
  if(detailUI.projectOpen&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const items=$$('[role="menuitem"]',$('#project-popover')),index=items.indexOf(document.activeElement);let next=e.key==='Home'?0:e.key==='End'?items.length-1:e.key==='ArrowDown'?(index+1)%items.length:(index-1+items.length)%items.length;items[next]?.focus();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'&&!$('#template-studio').open){e.preventDefault();e.stopImmediatePropagation();flushDiskSave().then(ok=>{if(ok)toast('已写入磁盘。')}).catch(x=>toast(x.message,'error'))}
},true);

async function releaseDiagnostics(){
  if(releaseUI.regressionBusy)return;releaseUI.regressionBusy=true;
  modal('v2.5 功能回归检查','<div class="notice">本检查在当前浏览器运行，不会访问 GitHub、不发送 API 请求，也不会修改工程。</div><div id="release-test-results" class="template-check-list" style="margin-top:16px"></div>','校验模板、发布请求、审校报告与输入区域保护。',true);
  const tests=[],test=async(name,fn)=>{try{if(await fn()===false)throw Error('断言不成立');tests.push({name,ok:true,message:'通过'})}catch(e){tests.push({name,ok:false,message:e.message})}};
  try{
    await test('合法的 scroll-behavior 不再触发误报',()=>validateOfflineCSS('html { scroll-behavior: smooth; } @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }'));
    await test('注释和字符串中的 url / @import 被正确忽略',()=>validateOfflineCSS('/* old url(https://example.com) @import */ p::after { content: "url(https://example.com) @import behavior:"; }'));
    await test('真正的 behavior 属性仍被拦截',()=>{try{validateOfflineCSS('p { behavior: url(unsafe.htc); }');return false}catch(e){return e.message.includes('behavior')}});
    await test('CSS 转义后的外部 URL 不绕过校验',()=>{try{validateOfflineCSS('p { background: u\\72l(https://example.com/x.png); }');return false}catch(e){return true}});
    await test('内联图片和页内 URL 可以离线使用',()=>validateOfflineCSS('p { background: url("data:image/png;base64,aGVsbG8="); filter: url(#soft); }'));
    await test('CSS 文件导入仍被明确拦截',()=>{try{validateOfflineCSS('@import "https://example.com/style.css";');return false}catch(e){return e.message.includes('@import')}});
    for(const t of designedTemplates())await test('内置版式：'+t.title,()=>{validateExportTemplate(t);return compileTemplateDocument(t,exportPreviewBooks()).includes('Content-Security-Policy')});
    for(const p of exportMarketCatalog)await test('市场版式：'+p.title,()=>validateExportTemplate(marketTemplate(p.id)));
    await test('GitHub 仓库地址与 owner/repo 均可识别',()=>{const a=githubRepoParts('https://github.com/example/comic-templates.git');return a.owner==='example'&&a.repo==='comic-templates'});
    await test('GitHub UTF-8 编码可还原中文模板',()=>base64UTF8(utf8Base64('海风来信 · {character}'))==='海风来信 · {character}');
    await test('更新 GitHub 文件时保留并发保护 SHA',()=>{const body=githubWriteBody('示例模板','Update template','main','test-sha');return body.sha==='test-sha'&&base64UTF8(body.content)==='示例模板'&&!('token' in body)});
    await test('新建 GitHub 文件不传空 SHA',()=>!('sha' in githubWriteBody('{}','Create template','main')));
    await test('仓库路径不允许跳出目录或修改 Actions',()=>{let blocked=0;for(const path of ['../secrets.json','.github/workflows/run.json','/private.json'])try{githubFilePath(path)}catch(e){blocked++}return blocked===3});
    await test('审校 endpoint 不重复拼接路径',()=>normalizedChatEndpoint('https://api.openai.com/v1/chat/completions/')==='https://api.openai.com/v1/chat/completions');
    await test('审校通过阈值和结构标准化',()=>{const c=normalizeCriticReport({score:6.5,summary:'需调整',anatomy:'手部不清晰',consistency:'缺少参考',suggestions:'refined hands',issues:[{area:'手部',severity:'high',observation:'轮廓不清',fixPrompt:'refined hands'}]});return !c.passed&&c.issues[0].fixPrompt==='refined hands'});
    await test('审校缺少必填字段不会伪造报告',()=>{try{normalizeCriticReport({score:8});return false}catch(e){return true}});
    await test('输入框分隔条有最小/最大高度保护',()=>{const small=composerBounds(460,54,145),large=composerBounds(800,54,180);return small.min<=small.max&&large.min<=large.max&&large.max<=430});
    await test('七步教程包含所有功能入口',()=>guideSteps.length===7&&guideSteps.every(s=>s.title&&s.action&&s.checks.length));
    const area=$('#release-test-results');if(area)area.innerHTML=tests.map(t=>`<div class="template-check-row"><span class="${t.ok?'accent':'danger'}">${icon(t.ok?'check':'close')}</span><span class="grow">${esc(t.name)}<small>${esc(t.message)}</small></span></div>`).join('')+`<div class="modal-footer"><span class="grow tiny muted">${tests.filter(t=>t.ok).length} / ${tests.length} 项通过；不代表真实服务联调已通过。</span>${btn('检查当前助手布局','expand','composer-layout-test')}</div>`;
    return tests;
  }finally{releaseUI.regressionBusy=false}
}

validateState=function(s){
  v3Core.validateState(s);const safeId=value=>typeof value==='string'&&/^[a-zA-Z0-9_-]{1,150}$/.test(value)&&!systemVariableKeys.has(value);
  const entriesOK=entries=>{if(!Array.isArray(entries)||entries.length>500)throw Error('变量列表结构不合法。');const ids=new Set(),keys=new Set();for(const e of entries){if(!safeId(e.id)||ids.has(e.id)||keys.has(e.key))throw Error('变量 ID 或名称重复、不合法。');checkVariableKey(e.key);if(!Object.hasOwn(variableTypes,e.type))throw Error('变量类型不合法。');ids.add(e.id);keys.add(e.key)}};
  for(const t of s.templates)for(const f of t.frames)if(f.id!==undefined&&!safeId(f.id))throw Error('分镜 ID 不合法。');
  if(s.creation){if(!Array.isArray(s.creation.plans)||!Array.isArray(s.creation.variableSets))throw Error('创作模型结构不完整。');for(const list of [s.creation.plans,s.creation.variableSets]){const ids=new Set();for(const item of list){if(!safeId(item.id)||ids.has(item.id)||typeof item.title!=='string'||!s.projects.some(p=>p.id===item.projectId))throw Error('创作资产 ID、名称或企划归属不合法。');ids.add(item.id)}}
    for(const set of s.creation.variableSets)entriesOK(set.entries);
    for(const p of s.creation.plans){if(!Array.isArray(p.variableSetIds)||new Set(p.variableSetIds).size!==p.variableSetIds.length||!p.sceneOverrides||typeof p.sceneOverrides!=='object'||Array.isArray(p.sceneOverrides)||!safeId(p.rowId)||!s.rows.some(r=>r.id===p.rowId)||typeof p.enabled!=='boolean')throw Error('画册计划结构不完整。');entriesOK(p.variables);for(const[id,o]of Object.entries(p.sceneOverrides)){if(!safeId(id)||!o||typeof o!=='object')throw Error('单幕覆盖不合法。');if(o.variables)entriesOK(o.variables)}}
  }
  if(s.settings.comfy.bindings)validateBindings(s.settings.comfy.bindings);
  if(s.settings.backend&&(!['PUT','POST'].includes(s.settings.backend.method)||typeof s.settings.backend.enabled!=='boolean'))throw Error('Python 保存配置不合法。');
  return true;
};

renameScopedVariable=async function(group,id,entryId){
  const list=variableOwner(group,id),entry=list?.find(e=>e.id===entryId);if(!entry)throw Error('变量不存在。');const old=entry.key;
  textModal('重命名变量及引用','新的变量标识符',old,async key=>{
    checkVariableKey(key);if(key===old){closeModal();return}
    const scopes=[...state.creation.variableSets.map(s=>s.entries),...state.creation.plans.flatMap(p=>[p.variables,...Object.values(p.sceneOverrides).map(o=>o.variables||[])])];
    if(scopes.some(entries=>entries.some(e=>e.key===old)&&entries.some(e=>e.key===key)))throw Error('至少一个作用域已经同时存在新旧变量名。请先处理同名冲突，避免覆盖。');
    const affected=state.templates.flatMap(t=>t.frames).filter(f=>(f.prompt+' '+f.caption).includes('{'+old+'}')).length;
    if(!await confirmAction('同步重命名 {'+old+'}？','这次改名会穿透当前工程的素材、本册/单幕覆盖、源分镜和通用节点映射。\n影响 '+affected+' 幕分镜。已有生成画册和队列快照保持不变。','确认全工程改名'))return;
    const re=new RegExp('\\{'+old+'\\}','g'),replace=text=>String(text||'').replace(re,'{'+key+'}');
    for(const entries of scopes)for(const e of entries)if(e.key===old)e.key=key;
    for(const p of state.creation.plans){p.title=replace(p.title);for(const o of Object.values(p.sceneOverrides))for(const field of ['name','prompt','caption','negative'])if(o[field]!==undefined)o[field]=replace(o[field])}
    for(const t of state.templates)for(const f of t.frames){f.prompt=replace(f.prompt);f.caption=replace(f.caption);f.negative=replace(f.negative)}
    for(const r of state.rows)for(const versions of Object.values(r.storyVersions))for(const v of versions)v.captions=v.captions.map(replace);
    for(const b of state.settings.comfy.bindings){if(b.source==='variable'&&String(b.value).replace(/^\{|\}$/g,'')===old)b.value=key;else if(b.source==='literal')b.value=replace(b.value)}
    save();closeModal();render();toast('变量名与所有活动引用已同步；已入队快照未改变。');
  },'仅匹配完整 {变量名}，不会误改类似的变量名。');
};

  handleAction=async function(action,data={},element){
    if(Object.hasOwn(actions,action)){if($('#welcome-dialog').open)return;hideTip();return actions[action](data,element)}

function artPromptDiagnostics(){const policy=ComfyComic.promptPolicy,results=[],test=(name,fn)=>{try{if(!fn())throw Error('断言未通过');results.push({name,pass:true})}catch(e){results.push({name,pass:false,detail:e.message})}};
  test('任意不闭合括号与连续括号均可提交',()=>['{{{{','}}}}','{','}', '{}','{char'].every(s=>validatePrompt(s)===s&&policy.interpolate(s,{})===s));
  test('NovelAI 权重语法与非变量括号原样保留',()=>policy.interpolate('{{knees up}}, {mouth mask}, {{{style}}}',{style:'anime'})==='{{knees up}}, {mouth mask}, {{{style}}}');
  test('只有已定义的单括号变量被识别',()=>policy.tokens('{character}, {unknown}, {{character}}',new Set(['character'])).filter(t=>t.type==='variable').length===1);
  test('部分变量为空时收敛连续逗号',()=>policy.interpolate('{character}, {outfit}, {style}, {weapon}, ',{character:'nahida',outfit:'',style:'',weapon:''})==='nahida');
  test('已定义但未提供的变量安全略过',()=>policy.interpolate('{character}, {outfit}, {prop}',{character:'Mio'},['character','outfit','prop'])==='Mio');
  test('未定义的占位文字不会被擅自删除',()=>policy.interpolate('{custom_unknown}',{})==='{custom_unknown}');
  test('不触碰权重括号内的连续逗号',()=>policy.interpolate('{{knees,,up}}, {outfit}, ',{outfit:''})==='{{knees,,up}}');
  test('数字零和 false 不被当作空变量',()=>policy.interpolate('{count}, {enabled}',{count:0,enabled:false})==='0, false');
  test('未填写的数字与 JSON 属性不阻断生成',()=>typedVariableValue({key:'strength',type:'number',value:''})===''&&typedVariableValue({key:'optional',type:'json',value:''})==='');
  test('默认角色展示名用于旁白，模型角色名只进入提示词',()=>{const spec=curatedAdventureSpec();return policy.interpolate('{character}',spec.identity)==='nanami'&&policy.interpolate(spec.captions[1],spec.identity).startsWith('七海收到')&&!spec.captions.some(text=>text.includes('{character}'))});
  test('更改展示名不会改变出图身份',()=>{const values={character:'nahida (genshin impact)',character_display_name:'小草神'};return policy.interpolate('{character}',values)==='nahida (genshin impact)'&&policy.interpolate('{character_display_name}出发了。',values)==='小草神出发了。'});
  test('示范画册与源模板分别保留展示名和提示词名',()=>{const sample=createCuratedDemo(state),entries=sample.creation.variableSets[0].entries;return sample.books[0].characterName==='七海'&&entries.find(e=>e.key==='character').value==='nanami'&&entries.find(e=>e.key==='character_display_name').value==='七海'&&sample.templates[0].frames[1].caption.includes('{character_display_name}')});
  test('五张分镜最后一跨页自动补白',()=>JSON.stringify(readerSpreadIndices(4,5))==='[4,null]');
  test('十二幕精选示范只有一个画册集、一册、一组设定',()=>{const demo=createCuratedDemo(state);return demo.books.length===1&&demo.templates.length===1&&demo.templates[0].frames.length===12&&demo.creation.variableSets.length===1});
  test('精选示范通过完整工程数据契约',()=>validateState(createCuratedDemo(state)));
  test('不规则提示词可进入非标准节点提交字典',()=>{const raw='{{{{, {mouth mask}, {{knees up}}, }}}}',execution={workflow:{'1832':{class_type:'WeiLinPromptUI',inputs:{positive:''}}},bindings:[{id:'free_test',enabled:true,label:'作者提示词',nodeId:'1832',path:'text',source:'positive',type:'text',allowCreate:false,allowLink:false}],objectInfo:{},randomizeSeeds:false};return buildMappedWorkflow({prompt:raw,_scope:{},renderOverride:false},{},{execution,preview:true}).workflow['1832'].inputs.positive===raw});
  test('后端仍为平铺10字段且删除携带 forceWrite',()=>{const payload=convertStudioStateToApiPayload(state,{},true);return !Object.hasOwn(payload,'state')&&payload.forceWrite===true&&ComfyComic.stateContract.requiredFields.every(key=>Object.hasOwn(payload,key))});
  modal('自由提示词与展示层自检','<div class="notice">检查在本地内存中执行，不发送 API 请求，也不会修改工程。</div>'+results.map(r=>`<div class="template-check-row"><span class="${r.pass?'accent':'danger'}">${icon(r.pass?'check':'close')}</span><span class="grow">${esc(r.name)}${r.detail?'<small>'+esc(r.detail)+'</small>':''}</span><span class="tiny muted">${r.pass?'通过':'未通过'}</span></div>`).join('')+'<div class="modal-footer">'+btn('检查原生 API 契约','shield','native-diagnostics')+btn('关闭','','close-modal','','primary')+'</div>','提示词自由与节点连线安全是两件独立的事。',true);return results;
}

    'shelf-page-prev':()=>{displayUI.page=Math.max(0,displayUI.page-1);refreshGallery();document.querySelector('.collection-toolbar')?.scrollIntoView({block:'start',behavior:'smooth'})},
    'shelf-page-next':()=>{const pagination=displayModel.page(getShelfBooks().length,displayUI.page);displayUI.page=Math.min(pagination.pages-1,pagination.index+1);refreshGallery();document.querySelector('.collection-toolbar')?.scrollIntoView({block:'start',behavior:'smooth'})},
    'display-diagnostics':()=>displayRegressionChecks(),
    'room-mode':d=>{if(!['spread','webtoon','gallery'].includes(d.mode)||!$('#reader').open)return;artUI.readerMode=d.mode;artUI.filmstrip=d.mode==='gallery';ui.mode=d.mode==='spread'?'manga':d.mode==='webtoon'?'webtoon':'focus';renderArtReader()}
  };
  handleAction=async function(action,data={},element){
    if(Object.hasOwn(shelfActions,action)){if($('#welcome-dialog').open)return;return shelfActions[action](data,element)}
    const result=await collectionDisplayCore.handleAction(action,data,element);
    if(['diagnostics','v3-diagnostics','release-diagnostics','art-prompt-checks'].includes(action)&&$('#modal-body'))$('#modal-body').insertAdjacentHTML('beforeend','<div class="modal-footer">'+btn(localeString('显示与语言')+' · '+localeString('系统自检'),'shield','display-diagnostics','','small')+'</div>');
    localizeWorkspace($('#modal[open]')||document.body);return result;
  };
  if(window.MutationObserver){displayUI.observer=new MutationObserver(records=>{if(displayUI.localizing)return;if(records.some(r=>r.type!=='attributes'||['title','placeholder','aria-label'].includes(r.attributeName)))queueLocalization(records)});displayUI.observer.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder','aria-label']})}
  ComfyComic.locale=displayUI.locale;ComfyComic.collectionDisplay=displayModel;
  loadCollectionFonts();
  window.addEventListener('resize',scheduleSidebarWordmarkFit);
  document.fonts?.addEventListener?.('loadingdone',scheduleSidebarWordmarkFit);
  document.fonts?.ready?.then(scheduleSidebarWordmarkFit);
}


document.addEventListener('load',event=>{if(event.target instanceof HTMLImageElement&&event.target.dataset.responsiveCover)updateCoverSizing(event.target)},true);


document.addEventListener('change',event=>{const el=event.target;try{
  if(el.id==='interface-language')changeInterfaceLanguage(el.value);
  if(el.id==='default-shelf-view')setShelfLayout(el.value);
  if(el.id==='default-room-view')ensureRoomDefaultChoice(el.value);
  if(el.dataset.studioPref==='reader.defaultMode')ensureRoomDefaultChoice(({manga:'spread',flip:'spread',focus:'gallery',webtoon:'webtoon'})[el.value]||'webtoon');
  if(el.id==='display-lettering'){if(!['editorial','calligraphy','classic'].includes(el.value))return;state.settings.presentation.lettering=el.value;document.documentElement.dataset.lettering=el.value;try{localStorage.setItem('cc-lettering',el.value)}catch(e){}save();loadCollectionFonts();updateCollectionFontStatus();scheduleSidebarWordmarkFit()}
  if(el.id==='shelf-select-all'){for(const book of getShelfBooks())el.checked?ui.selected.add(book.id):ui.selected.delete(book.id);refreshGallery()}
}catch(error){toast(error.message,'error')}});


function displayRegressionChecks(){const results=[],test=(name,run)=>{try{if(run()===false)throw Error('Assertion failed');results.push({name,passed:true})}catch(e){results.push({name,passed:false,message:e.message})}};
  test('Showcase and grid are explicit persistent modes',()=>displayModel.mode('showcase')==='showcase'&&displayModel.mode('grid')==='grid');
  test('Grid pagination handles 100 books and the last page',()=>{const p=displayModel.page(100,99);return p.index===4&&p.start===96&&p.end===100&&p.pages===5});
  test('A landscape cover fits without stretching or cropping',()=>{const f=displayModel.fit(1920,1080,600,600);return f.width===600&&f.height===337.5});
  test('A tall page fits a mobile viewport proportionally',()=>{const f=displayModel.fit(800,2400,320,560);return f.height===560&&Math.abs(f.width/f.height-1/3)<.00001});
  test('Invalid image sizes do not produce NaN',()=>displayModel.fit(0,0,320,500).width===0);
  test('Native language labels switch without an API',()=>{const l=createStudioLocaleCatalog('en');if(l.text('画册集')!=='Collections')return false;l.setLanguage('zh-CN');return l.text('画册集')==='画册集'});
  test('Unknown artwork text is not machine-translated',()=>createStudioLocaleCatalog('en').translate('海风与未寄出的信')==='海风与未寄出的信');
  test('Language switching leaves authored text and prompt inputs unchanged',()=>{const old=displayUI.locale.language,root=document.createElement('div');root.innerHTML='<span data-user-content>设置</span><button>设置</button><textarea>{character}, {{{quality}}}</textarea>';try{displayUI.locale.setLanguage('en');localizeWorkspace(root);return root.querySelector('[data-user-content]').textContent==='设置'&&root.querySelector('button').textContent==='Settings'&&root.querySelector('textarea').value==='{character}, {{{quality}}}'}finally{displayUI.locale.setLanguage(old)}});
  test('Demo cleanup retains the first image and updates counts',()=>{const first={stepIndex:0,image:'keep'},b={curatedDemo:true,totalSteps:3,generatedSteps:3,steps:[first,{stepIndex:1,image:'old'},{stepIndex:2,image:'old'}]};return trimUntouchedDemoBook(b,s=>s.image==='old')&&b.steps[0]===first&&b.totalSteps===1&&b.generatedSteps===1});
  test('Modified artwork is protected from demo cleanup',()=>{const b={curatedDemo:true,steps:[{stepIndex:0,image:'keep'},{stepIndex:1,image:'my-art'}]};return !trimUntouchedDemoBook(b,s=>s.image==='old')&&b.steps.length===2});
  test('An edited demo caption is not treated as untouched sample data',()=>originalDemoPage({stepIndex:3,name:'通往海岸的小路',image:scenicDemoFrame(3,45),caption:'My rewritten story',prompt:'my prompt'})===false);
  test('Fresh cover sample retains the 12-frame source storyboard',()=>{const s=createCuratedDemo(state);return s.books.length===1&&s.books[0].steps.length===1&&s.templates[0].frames.length===12});
  test('Opening preference defaults to scroll reading',()=>{const s={settings:{presentation:{}},books:[]};ensureCollectionDisplay(s);return s.settings.presentation.defaultReaderMode==='webtoon'});
  test('Presentation preferences remain in the flat config payload',()=>{const payload=convertStudioStateToApiPayload(state,{},false);return !('state' in payload)&&payload.uiConfig.comfyStudio.settings.presentation.language===state.settings.presentation.language});
  test('Enabled activity log is included exactly once in sidebar navigation',()=>{const policy=createWorkspaceChromePolicy();return policy.navigation({logs:true}).filter(item=>item[0]===6).length===1&&!policy.navigation({logs:false}).some(item=>item[0]===6)});
  test('The actual sidebar reflects the saved log visibility switch',()=>Boolean($('#sidebar [data-act="art-nav"][data-route="6"]'))===(state.settings.studio.visibility.logs===true));
  test('Language and display settings exist only in Appearance & reading',()=>{const policy=createWorkspaceChromePolicy();return policy.ownsDisplayPreferences('appearance')&&!policy.ownsDisplayPreferences('general')});
  test('Artistic wordmarks are sized within the available sidebar width',()=>{const policy=createWorkspaceChromePolicy(),size=policy.brandFontSize(22,116,160);return size>0&&size<22&&160*size/22<116&&policy.brandFontSize(24,0,150)===0});
  test('Workflow configuration and Extensions use the updated localized labels',()=>{const locale=extendStudioLocaleCatalog(createStudioLocaleCatalog('en'));return locale.text('工作流配置')==='Workflow configuration'&&locale.text('扩展功能')==='Extensions'});
  test('Collection deletion retains unrelated books and shared assets',()=>{const sample={projects:[{id:'a',title:'A'},{id:'b',title:'B'}],activeProjectId:'a',books:[{id:'one',projectId:'a',templateId:'shared'},{id:'two',projectId:'b',templateId:'shared'}],templates:[{id:'shared',projectId:'a'}],rows:[],queue:[{id:'pending',bookId:'one'}],chats:[{id:'chat_b',projectId:'b',messages:[]}],activeChatId:'chat_b',creation:{plans:[],variableSets:[]},settings:{}},result=planCollectionRemoval(sample,'a');return result.next.books.length===1&&result.next.books[0].id==='two'&&result.next.templates[0].projectId==='b'&&result.next.queue.length===0&&sample.books.length===2});
  test('Deleting the last collection leaves a safe empty workspace',()=>{const sample={projects:[{id:'last',title:'Last'}],activeProjectId:'last',books:[],rows:[],templates:[],queue:[],chats:[],creation:{plans:[],variableSets:[]},settings:{}},result=planCollectionRemoval(sample,'last',{id:'empty',title:'Empty'});return result.next.projects.length===1&&result.next.activeProjectId==='empty'&&result.next.books.length===0&&result.next.chats.length===1});
  modal(localeString('显示与语言')+' / '+localeString('系统自检'),'<p class="service-note">These checks run locally in your browser. They do not access the backend or download images.</p>'+results.map(r=>`<div class="template-check-row"><span class="${r.passed?'accent':'danger'}">${icon(r.passed?'check':'close')}</span><span class="grow">${esc(r.name)}${r.message?'<small>'+esc(r.message)+'</small>':''}</span><span class="tiny muted">${localeString(r.passed?'通过':'未通过')}</span></div>`).join('')+'<div class="modal-footer">'+shelfButton('check','close-modal','关闭','','primary')+'</div>');return results;
}
