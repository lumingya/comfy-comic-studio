document pre{position:relative;background:#1e3028;color:#e2efdf;padding:27px 22px 23px;border-radius:12px;overflow:auto;line-height:1.65;font-size:12px;margin:23px 0}.document code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.9em}.document :not(pre)>code{padding:3px 6px;background:#e8ede3;border-radius:4px;color:#356146;overflow-wrap:anywhere}.document pre code{font-size:inherit;white-space:pre}.copy-code{display:block;margin:0 0 -15px auto;position:relative;z-index:1;background:#f7f6f0;border:1px solid #cbd6c6;border-radius:7px;padding:4px 10px;font-size:11px;color:#526f5c}.table-scroll{overflow:auto;margin:24px 0;border:1px solid var(--line);border-radius:10px}.document table{border-collapse:collapse;font-size:13px;width:100%;min-width:480px}.document th{text-align:left;background:#eaf0e5;font-weight:600}.document th,.document td{padding:12px 15px;border-bottom:1px solid var(--line);vertical-align:top}.document tr:last-child td{border-bottom:0}.document td{background:#fcfcf8}.document hr{border:0;border-top:1px solid var(--line);margin:40px 0}.toc{position:sticky;top:117px;align-self:start;max-height:calc(100vh - 155px);overflow:auto;font-size:12px}.toc-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:15px}.toc a{display:block;text-decoration:none;color:#65756a;padding:6px 0 6px 14px;border-left:1px solid var(--line);line-height:1.6}.toc a:hover,.toc a.active{color:#267451;border-color:#267451}.toc a.sub{font-size:11px;padding-left:26px}.toc hr{border:0;border-top:1px solid var(--line);margin:25px 0}.toc .tools a{border:0;padding-left:0}.endnote{display:flex;justify-content:space-between;gap:20px;margin-top:55px;border-top:1px solid var(--line);padding-top:23px;color:var(--muted);font-size:12px}.progress{height:2px;background:#659877;position:fixed;left:0;top:0;z-index:9;width:0}.load-error{background:#f4e7dc;padding:20px;border-radius:8px}#copy-status{position:fixed;bottom:18px;left:50%;transform: </style></head><body><div class="progress" id="progress"></div><header><div class="header-left"><a class="brand" href="__HOME__">Mio<span>.</span></a><span class="kicker">THE MIO HANDBOOK</span></div><nav class="header-actions" aria-label="文档导航"><a href="__HOME__" id="home-label">← 教程中心</a><a href="__APP__" class="open-app" id="app-label">打开工作台 ↗</a></nav></header><div class="layout"><main><div class="crumb"><a href="__HOME__">Mio / Handbook</a> <span id="file-path"></span></div><details class="mobile-toc"><summary id="mobile-toc-title">本页目录</summary><div id="mobile-toc"></div></details><article class="document" id="document"><p>正在排版文档…</p></article><footer class="endnote"><span>Mio · Stories in frames</span><a href="__SOURCE__?raw=1" id="raw-source">查看 Markdown 源码 ↗</a></footer></main><aside class="toc" aria-label="本页目录"><div class="toc-label" id="toc-label">ON THIS PAGE / 本页目录</div><nav id="toc"></nav><hr><div class="tools"><a href="__HOME__" id="back-label">浏览全部教程 ↗</a><a href="#" id="print-link">打印 / 另存为 PDF</a></div></aside></div><div id="copy-status" role="status" aria-live="polite"></div>
<script id="document-data" type="application/json">__DOC_DATA__</script>

<script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('document-data').textContent),en=data.english,article=document.getElementById('document');document.documentElement.lang=en?'en':'zh-CN';document.getElementById('file-path').textContent=' / '+data.path;
if(en){document.getElementById('home-label').textContent='← Handbook';document.getElementById('app-label').textContent='Open studio ↗';document.getElementById('raw-source').textContent='View Markdown source ↗';document.getElementById('back-label').textContent='All chapters ↗';document.getElementById('print-link').textContent='Print / Save as PDF';document.getElementById('toc-label').textContent='ON THIS PAGE';document.getElementById('mobile-toc-title').textContent='On this page'}
try{article.innerHTML=DOMPurify.sanitize(marked.parse(data.markdown,{gfm:true,breaks:false}),{FORBID_TAGS:['style','form','input','button','iframe','object','embed'],FORBID_ATTR:['style','srcset']});}catch(error){article.textContent=en?'This document could not be rendered. Use the source link below.':'文档排版失败，请使用下方源码入口。';article.classList.add('load-error')}
// Prebuilt HTML siblings make every guide work from both HTTP and file://.
article.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(!/^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(href))a.setAttribute('href',href.replace(/\.md(?=[?#]|$)/i,'.html'));if(/^https?:/i.test(href))a.rel='noopener noreferrer'});
const used=new Set();article.querySelectorAll('h1,h2,h3').forEach(h=>{const base=h.id||h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}_\-\s]/gu,'').replace(/\s+/g,'-')||'section';let id=base,n=0;while(used.has(id))id=base+'-'+(++n);used.add(id);h.id=id;if(h.tagName==='H1'&&!document.title.startsWith(h.textContent))document.title=h.textContent+' · Mio';if(h.tagName==='H1')return;const a=document.createElement('a');a.href='#'+encodeURIComponent(id);a.textContent=h.textContent;if(h.tagName==='H3')a.className='sub';document.getElementById('toc').append(a);document.getElementById('mobile-toc').append(a.cloneNode(true))});
article.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.setAttribute('aria-label',en?'Scrollable table':'可横向滚动的表格');table.before(wrap);wrap.append(table)});
article.querySelectorAll('pre').forEach(pre=>{const button=document.createElement('button');button.type='button';button.className='copy-code';button.textContent=en?'Copy code':'复制代码';pre.before(button);button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(pre.textContent);button.textContent=en?'Copied ✓':'已复制 ✓';setTimeout(()=>button.textContent=en?'Copy code':'复制代码',1800)}catch(e){const selection=getSelection(),range=document.createRange();range.selectNodeContents(pre);selection.removeAllRanges();selection.addRange(range);const status=document.getElementById('copy-status');status.textContent=en?'Code selected. Press Ctrl/Cmd+C.':'已选中代码，请按 Ctrl/Cmd+C 复制。';status.style.opacity=1;setTimeout(()=>status.style.opacity=0,3000)}})});
document.getElementById('print-link').addEventListener('click',e=>{e.preventDefault();print()});const updateProgress=()=>{const range=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(range>0?Math.min(100,scrollY/range*100):100)+'%'};addEventListener('scroll',updateProgress,{passive:true});updateProgress();
if(location.hash){requestAnimationFrame(()=>{try{document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView()}catch(e){}})}
})();
</script></body></html>
