<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc"><title id="title">新版创作流程</title><desc id="desc">分镜与文本预设装配成画册快照，开始生成后进入任务引擎，采用图片后阅读与导出。</desc><rect width="1000" height="190" rx="16" fill="#e9eee6"/><g font-family="system-ui,Microsoft YaHei,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#a4b49c"><rect x="24" y="42" width="210" height="104" rx="10"/><rect x="273" y="42" width="210" height="104" rx="10"/><rect x="522" y="42" width="210" height="104" rx="10"/><rect x="771" y="42" width="205" height="104" rx="10"/></g><g fill="#263e2c" font-size="20"><text x="129" y="84">分镜 ＋ 文本预设</text><text x="378" y="84">装配画册快照</text><text x="627" y="84">任务引擎出图</text><text x="873" y="84">阅读与导出</text></g><g fill="#6a7e60" font-size="14"><text x="129" y="118">可复用的模板</text><text x="378" y="118">此时还未调用模型</text><text x="627" y="118">候选 → 采用</text><text x="873" y="118">以采用图片为准</text></g><g fill="#59754b" font-size="25"><text x="254" y="103">→</text><text x="503" y="103">→</text><text x="752" y="103">→</text></g></g></svg>