[tool.ruff]
line-length = 100
target-version = "py311"
# Adapted from the v3 ecosystem implementation; source history remains in the legacy-v3.2 tag.
extend-exclude = [
    "tests/test_workflow_slots.py",
    "tests/test_workflow_slots_v3.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]
