<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>剧本审阅与 Diff 助手</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.65 system-ui,
          sans-serif;
      }
      body {
        max-width: 1000px;
        margin: 24px auto;
        padding: 0 18px 32px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 14px;
      }
      button,
      textarea {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid #8886;
        border-radius: 5px;
        padding: 7px 12px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 100px;
        resize: vertical;
        margin: 8px 0;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      article {
        padding: 18px 0;
        border-bottom: 1px solid #8884;
      }
      article > label {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .diff {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .before,
      .after {
        margin: 6px 0;
        padding: 10px;
        border-left: 2px solid #8886;
        min-width: 0;
      }
      .after {
        border-color: #9c8154;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 5px 0;
        font: inherit;
      }
      p,
      label {
        overflow-wrap: anywhere;
      }
      small {
        opacity: 0.7;
      }
      #status {
        white-space: pre-wrap;
      }
      @media (max-width: 600px) {
        .diff {
          grid-template-columns: 1fr;
          gap: 0;
        }
        body {
          margin: 16px auto;
          padding-inline: 12px;
        }
      }
    </style>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <h1>剧本审阅与 Diff 助手</h1>
    <p>
      写下修改要求，生成建议后逐条审阅。只有点击「应用勾选的修改」才写入作品；未勾选的建议保持原样。
    </p>
    <label for="instruction">修改要求</label>
    <textarea
      id="instruction"
      placeholder="例如：缩短第二幕对白，保留原有镜头与人物设定。"
    ></textarea>
    <div class="toolbar">
      <button id="propose" disabled>生成审阅建议</button>
      <button id="accept-all" disabled>勾选全部可用建议</button>
      <button id="reject-all" disabled>全部拒绝</button>
      <button id="apply" disabled>应用勾选的修改</button>
    </div>
    <p>
      <small
        >生成建议会调用已配置的文本模型，可能消耗额度；不会自动生成或重试。</small
      >
    </p>
    <p id="status" role="status" aria-live="polite">正在连接面板…</p>
    <p id="revision"></p>
    <div id="ops"></div>
  </body>
</html>
