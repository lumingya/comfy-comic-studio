<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>智能质检与辅助挑图</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.65 system-ui,
          sans-serif;
      }
      body {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 18px 32px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
      }
      h2 {
        font-size: 17px;
      }
      p {
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid #8886;
        border-radius: 5px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      article:focus {
        outline: 2px solid #a47b50;
        outline-offset: 3px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      article {
        padding: 18px 0;
        border-bottom: 1px solid #8884;
        scroll-margin-top: 12px;
      }
      .candidate {
        margin: 12px 0;
        padding: 12px;
        border: 1px solid #8884;
        border-radius: 5px;
      }
      .candidate label {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .candidate p {
        margin: 6px 0;
      }
      small {
        opacity: 0.7;
        overflow-wrap: anywhere;
      }
      ul {
        padding-left: 24px;
      }
      #status,
      #job {
        white-space: pre-wrap;
      }
      #issues:empty,
      #job:empty {
        display: none;
      }
      @media (max-width: 480px) {
        body {
          margin: 16px auto;
          padding-inline: 12px;
        }
        button {
          padding: 6px 9px;
        }
      }
    </style>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <h1>智能质检与辅助挑图</h1>
    <p>
      查看真实评审记录和逐幕问题。提交会使用已配置的视觉模型，可能消耗额度；不会自动采用或淘汰图片。
    </p>
    <div class="toolbar">
      <button id="load" disabled>读取候选与报告</button>
      <button id="review" disabled>评审所选候选</button>
      <button id="refresh-job" disabled>刷新任务进度</button>
      <label
        ><input id="problems-only" type="checkbox" />只看有问题或未评审</label
      >
    </div>
    <p id="status" role="status" aria-live="polite">正在连接面板…</p>
    <p id="job" role="status"></p>
    <nav id="issues" aria-label="逐幕问题定位"></nav>
    <div id="takes"></div>
  </body>
</html>
