function changeProject(id){flushEditor();if(!state.projects.some(p=>p.id===id))return;state.activeProjectId=id;ui.templateId=projectTemplates()[0]?.id;ui.storyTemplateId=ui.templateId;ui.storyRowId=projectRows()[0]?.id;ui.frameIndex=0;ui.selected.clear();ui.search='';save();render()}
function storeSetting(el){const parts=el.dataset.setting.split('.');if(parts.some(p=>['__proto__','constructor','prototype'].includes(p)))return;let obj=state.settings;for(const p of parts.slice(0,-1)){if(!obj[p]||typeof obj[p]!=='object')return;obj=obj[p]}obj[parts.at(-1)]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;if(el.dataset.setting==='autoCritique'&&el.checked)rt.criticFailures=0;save()}
function saveStoryInputs(){const row=rowBy(ui.storyRowId),t=templateBy(ui.storyTemplateId),fields=$$('[data-story-caption]');if(!row||!t||!fields.length||rt.lockedRows.has(row.id))return;const v=ensureManual(row,t);fields.forEach(e=>v.captions[Number(e.dataset.storyCaption)]=e.value);v.updatedAt=Date.now();save()}
async function deleteBooks(ids){if(ids.some(id=>bookBy(id)?.inProgress||[...rt.redraw].some(k=>k.startsWith(id+':'))))throw Error('请先停止画册的渲染或精修任务。');if(!await confirmAction('删除 '+ids.length+' 本画册？','画册与生成图片将从工程中移除，无法撤销。模板、角色和剧情版本会保留。','删除画册'))return;state.books=state.books.filter(b=>!ids.includes(b.id));state.queue=state.queue.filter(q=>!ids.includes(q.bookId));ui.selected.clear();save(true);closeModal();render();toast('画册已删除，源资产已保留。')}
function enqueueSelected(){const rows=projectRows().filter(r=>r.active),t=currentTemplate();if(!t||!rows.length)throw Error('请选择至少一个角色和一个模板。');for(const r of rows)if(!state.queue.some(q=>q.rowId===r.id&&q.templateId===t.id&&['pending','running','paused'].includes(q.status))){const b=enqueueBook(r,t);b.aspectRatio=t.frames[0].width/t.frames[0].height}save();return rows.length}
function columnModal(old=''){modal(old?'编辑变量 {'+old+'}':'新增自定义变量',`${field('变量标识符',input('column',old,'text','id="column-name" pattern="[a-zA-Z0-9_]+" required placeholder="例如 character2、weapon、mood"'))}<div class="notice">变量直接平铺在角色行对象中。重命名将精确改写所有模板的提示词与台词，不影响相似名称。</div><div class="modal-footer">${old?btn('删除此变量','trash','column-delete',`data-key="${esc(old)}"`,'danger'):''}${btn('保存变量','check','column-save',`data-key="${esc(old)}"`,'primary')}</div>`)}
function diagnostics(){const tests=[];const test=(name,fn)=>{try{if(fn()===false)throw Error('验证失败');tests.push([name,true,'通过'])}catch(e){tests.push([name,false,e.message])}};test('工程核心数据契约',()=>validateState(state));test('平铺宏变量插值',()=>interpolate('{character}/{character2}',{character:'A',character2:'B'})==='A/B');test('宏变量全字边界防碰撞',()=>'{character}/{character2}'.replace(new RegExp('\\{character\\}','g'),'{hero}')==='{hero}/{character2}');test('缺帧并集判定',()=>JSON.stringify(missingIndices({totalSteps:4,steps:[{stepIndex:0,image:'ready'},{stepIndex:1,image:''},{stepIndex:2,image:'svg',offlineFallback:true}]}))==='[1,2,3]');test('旧宏变量防删除',()=>{try{validatePrompt('character','{character}');return false}catch(e){return true}});test('八个标准工具 Schema',()=>assistantTools.length===8&&new Set(assistantTools.map(t=>t.function.name)).size===8);test('奇数页空白补齐边界',()=>{const n=5,last=Math.floor((n-1)/2)*2;return last===4&&last+1>=n});test('API 工作流扁平结构',()=>!!validateWorkflow(defaultWorkflow));test('确定性 SVG 输出',()=>svgArt(1,42)===svgArt(1,42));test('XML 中文 Schema 校验',()=>parseTemplateXML('<模板><标题>测试</标题><简介>测试</简介><分镜列表><分镜1><名称>一</名称><提示词>{character}</提示词><剧情>测试</剧情></分镜1></分镜列表></模板>').frames.length===1);modal('本地系统自检',`<div class="notice">这些检查在当前浏览器内真实执行，覆盖数据与边界逻辑；不代表远端 GPU 或 LLM 集成已验证。</div>${tests.map(([n,ok,d])=>`<div class="row" style="padding:14px 0;border-bottom:1px solid var(--line)"><span class="${ok?'accent':'danger'}">${icon(ok?'check':'close')}</span><span class="grow small">${n}</span><span class="tiny muted">${esc(d)}</span></div>`).join('')}`);return tests}

case'command':openCommand();break;

case'new-book':newBookModal();break;
case'create-book':{const r=rowBy($('#new-book-row').value),t=templateBy($('#new-book-template').value),title=$('#new-book-title').value.trim();if(!title)throw Error('请输入画册标题。');const b=enqueueBook(r,t);b.title=title;b.aspectRatio=t.frames[0].width/t.frames[0].height;save();closeModal();render();if(d.start)void runQueue();else toast('新画册已加入队列。');break}
case'new-template':flushEditor();textModal('新建分镜模板','模板名称','未命名故事',v=>{const t={id:uid('tpl'),projectId:state.activeProjectId,title:v,outline:'',frames:[makeFrame(0)],createdAt:Date.now()};state.templates.push(t);ui.templateId=t.id;ui.frameIndex=0;save();closeModal();navigate(1)});break;

case'clone-frame':{flushEditor();const t=currentTemplate(),f=clone(t.frames[ui.frameIndex]);f.id=uid('f');f.name+=' · 副本';t.frames.splice(ui.frameIndex+1,0,f);ui.frameIndex++;save();render();break}
case'delete-frame':{flushEditor();const t=currentTemplate();if(t.frames.length===1)throw Error('至少保留一幕。');if(await confirmAction('删除当前分镜？','源分镜会被移除；已生成画册保持不变。','删除分镜')){t.frames.splice(ui.frameIndex,1);ui.frameIndex=Math.min(ui.frameIndex,t.frames.length-1);save(true);render()}break}

function changeStudioPreference(el){

function assistantToolDraft(template,name,args={}){
  const text=(value,key)=>{if(typeof value!=='string'||value.length>50000)throw Error(key+' 必须为有效文本。');return value};

    case 'update_template_outline':template.outline=text(args.outline,'outline');break;

    case 'delete_frame':frame(args.frameIndex);if(template.frames.length===1)throw Error('模板至少保留一幕。');template.frames.splice(args.frameIndex,1);break;
    case 'swap_frames':frame(args.indexA);frame(args.indexB);[template.frames[args.indexA],template.frames[args.indexB]]=[template.frames[args.indexB],template.frames[args.indexA]];break;

async function applyScopedToolBatch(calls,scopeId){

function scopedMockCall(text,template){

  const match=text.match(/第\s*([0-9一二三四五六七八九十]+)\s*幕/),index=match?chineseNumber(match[1])-1:template?.id===ui.templateId?ui.frameIndex:0;
  const replacement=text.replace(/^.*?(?:改成|改为|调整为|设为)[：: ]*/,'');
  if(/新增|添加.*幕/.test(text)){const caption=text.replace(/^.*?(?:新增一幕|新增|添加一幕)[：: ]*/,'');return {name:'add_new_frame',args:{name:'新的一幕',prompt:'{character}, {style}, {outfit}, '+caption,caption}}}

}

function captureWelcomeIdentity(){
  const name=$('#welcome-name')?.value.trim(),creator=$('#welcome-creator')?.value.trim()||'';if(!name||name.length>40)throw Error('请先输入工作室名称。');
  const value={workspaceName:name,creatorName:creator,onboarded:true};Object.assign(state.settings.identity,value);state.settings.signature=creator||name;detailUI.profileDraft=value;return value;
}
function finishWelcome(){state.settings.identity.onboarded=true;rememberProfile();$('#welcome-dialog').close();save();render()}

function bindChatToTemplate(id,newBranch=false){
  const template=templateBy(id);if(!template)return null;
  const old=currentChat();if(old&&$('#chat-input'))old.draft=$('#chat-input').value;
  let chat=!newBranch?state.chats.find(c=>c.templateId===id):null;
  if(!chat){const reusable=!newBranch?state.chats.find(c=>!c.templateId&&!c.messages.some(m=>m.role==='user')):null;chat=reusable||{id:uid('chat'),messages:[]};if(!reusable)state.chats.push(chat);chat.templateId=id;chat.projectId=template.projectId;const count=state.chats.filter(c=>c.templateId===id).length;chat.title=template.title.slice(0,22)+' · 对话 '+count;chat.draft=''}
  state.activeChatId=chat.id;studioUI.assistantDraft=chat.draft||'';if($('#chat-input'))$('#chat-input').value=studioUI.assistantDraft;save();return chat;
}

async function verifyGithubTarget(cfg,signal){
  const repo=await githubRequest(githubBase(cfg),{token:cfg.token,signal});const branch=cfg.branch||repo.default_branch;if(!branch)throw Error('仓库没有可用分支，请先创建 README。');await githubRequest(githubBase(cfg)+'/branches/'+encodeURIComponent(branch),{token:cfg.token,signal});
  const file=await githubRequest(githubBase(cfg)+'/contents/'+encodedPath(cfg.path)+'?ref='+encodeURIComponent(branch),{token:cfg.token,signal,missing:true});if(file&&file.type!=='file')throw Error('目标路径不是普通文件，请换一个文件名。');return {repo,branch,file};
}
async function checkGithubTarget(){

  catch(e){$('#github-result').innerHTML=`<span class="service-status error">${esc(safeServiceError(e))}</span>`;throw e}
  finally{setGithubBusy(false);releaseUI.githubController=null}
}

    if(!await confirmAction(target.file?'更新 GitHub 上的同名文件？':'将模板上传到 GitHub？',`资源：${pkg.title}\n目标：${cfg.owner}/${cfg.repo} / ${target.branch} / ${cfg.path}\n可见性：${target.repo.private?'私有仓库，仅有权限的人可读取':'公开仓库，任何人都可读取'}\n${target.file?'将创建新提交并替换当前文件。Git 历史保留旧版本。':'将创建一个新的仓库文件。'}\n不会上传私有画册或 API 配置。`,'确认提交')){$('#github-result').innerHTML='<span class="service-status">已取消提交，GitHub 文件未被修改。</span>';return}

    const raw='https://raw.githubusercontent.com/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/'+sha+'/'+encodedPath(cfg.path),page='https://github.com/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/blob/'+sha+'/'+encodedPath(cfg.path);

  }catch(e){let message=safeServiceError(e);if(putStarted&&(e.name==='AbortError'||/网络|浏览器无法/.test(message)))message+=' 提交可能已到达 GitHub，请先检查仓库再重试，避免重复提交。';$('#github-result').innerHTML=`<span class="service-status error">${esc(message)}</span>`;throw Error(message)}
  finally{setGithubBusy(false);releaseUI.githubController=null}

renameScopedVariable=async function(group,id,entryId){
  const list=variableOwner(group,id),entry=list?.find(e=>e.id===entryId);if(!entry)throw Error('变量不存在。');const old=entry.key;
  textModal('重命名变量及引用','新的变量标识符',old,async key=>{

    const scopes=[...state.creation.variableSets.map(s=>s.entries),...state.creation.plans.flatMap(p=>[p.variables,...Object.values(p.sceneOverrides).map(o=>o.variables||[])])];
    if(scopes.some(entries=>entries.some(e=>e.key===old)&&entries.some(e=>e.key===key)))throw Error('至少一个作用域已经同时存在新旧变量名。请先处理同名冲突，避免覆盖。');
    const affected=state.templates.flatMap(t=>t.frames).filter(f=>(f.prompt+' '+f.caption).includes('{'+old+'}')).length;
    if(!await confirmAction('同步重命名 {'+old+'}？','这次改名会穿透当前工程的素材、本册/单幕覆盖、源分镜和通用节点映射。\n影响 '+affected+' 幕分镜。已有生成画册和队列快照保持不变。','确认全工程改名'))return;
    const re=new RegExp('\\{'+old+'\\}','g'),replace=text=>String(text||'').replace(re,'{'+key+'}');
    for(const entries of scopes)for(const e of entries)if(e.key===old)e.key=key;
    for(const p of state.creation.plans){p.title=replace(p.title);for(const o of Object.values(p.sceneOverrides))for(const field of ['name','prompt','caption','negative'])if(o[field]!==undefined)o[field]=replace(o[field])}
    for(const t of state.templates)for(const f of t.frames){f.prompt=replace(f.prompt);f.caption=replace(f.caption);f.negative=replace(f.negative)}
    for(const r of state.rows)for(const versions of Object.values(r.storyVersions))for(const v of versions)v.captions=v.captions.map(replace);
    for(const b of state.settings.comfy.bindings){if(b.source==='variable'&&String(b.value).replace(/^\{|\}$/g,'')===old)b.value=key;else if(b.source==='literal')b.value=replace(b.value)}
    save();closeModal();render();toast('变量名与所有活动引用已同步；已入队快照未改变。');
  },'仅匹配完整 {变量名}，不会误改类似的变量名。');
};
